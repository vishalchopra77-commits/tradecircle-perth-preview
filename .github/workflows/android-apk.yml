name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare web assets and sync Capacitor
        run: |
          bash scripts/prepare-www.sh
          npx cap sync android

      - name: Set the version number (goes up by 1 every build)
        id: ver
        run: |
          # Builds 1-4 happened before numbering started, so the next build is v1.
          N=$(( ${{ github.run_number }} - 4 ))
          if [ "$N" -lt 1 ]; then N=1; fi
          sed -i -E "s/versionCode [0-9]+/versionCode $N/; s/versionName \"[^\"]*\"/versionName \"$N\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Name the APK RateBuddies-vN
        id: apkname
        run: |
          N=${{ steps.ver.outputs.n }}
          cp android/app/build/outputs/apk/debug/app-debug.apk "RateBuddies-v$N.apk"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RateBuddies-v${{ steps.apkname.outputs.n }}
          path: RateBuddies-v${{ steps.apkname.outputs.n }}.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apkname.outputs.n }}
          name: Rate Buddies v${{ steps.apkname.outputs.n }}
          body: |
            Rate Buddies v${{ steps.apkname.outputs.n }} test build (debug APK for sideloading on your phone).
            On Android, allow installing from this browser or “unknown apps”, then open the APK.
            Sign-in details are in the private test-logins file, not in this repo.
            The web admin is at the GitHub Pages admin.html URL after this version is published, and shares the same test data.
          files: RateBuddies-v${{ steps.apkname.outputs.n }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
