<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rate Buddies — Super admin (prototype v2.2.0)</title>
  <meta name="theme-color" content="#0A1328" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/icon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <style>
/* admin.css */
/* TradeCircle Perth — super admin (v1.5.1) */
:root {
  --navy: #0A1328;
  --navy-2: #15244A;
  --accent: #1A5FD4;
  --accent-2: #1658C7;
  --accent-ink: #0D3F9C;
  --accent-soft: #E8F1FD;
  --bg: #F0F4F8;
  --card: #fff;
  --ink: #122033;
  --muted: #334155;
  --line: #E3E8EE;
  --danger: #B42318;
  --warn: #8A5A00;
  --fb: #1877F2;
  --shadow: 0 8px 24px rgba(11, 31, 51, .08);
  --shadow-lg: 0 18px 40px rgba(11, 31, 51, .12);
  --radius: 18px;
  --bottom-nav: 72px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; }
a { color: #0D65D9; }
button svg, .icon-btn svg, .nav-btn svg, .btn svg { flex: 0 0 auto; }

/* Login */
.admin-login {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(900px 420px at 12% -8%, rgba(58,160,252,.28), transparent 52%),
              radial-gradient(800px 400px at 100% 100%, rgba(24,119,242,.16), transparent 50%),
              linear-gradient(180deg, #0A1A2B, #07131F);
}
.login-card {
  width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 32px 28px;
  box-shadow: 0 28px 60px rgba(0,0,0,.28);
}
.login-mark {
  width: 64px; height: 64px; border-radius: 16px; display: block; object-fit: cover;
  margin: 0 auto 12px; background: #0A1328;
  box-shadow: 0 8px 18px rgba(10, 19, 40, .35);
}
.login-mark.sm {
  width: 78px; height: auto; border-radius: 0; margin: 0;
  background: transparent; box-shadow: none; object-fit: contain;
}
.login-wordmark {
  display: block; text-align: center; font-size: 18px; font-weight: 800;
  letter-spacing: -0.03em; text-transform: uppercase; color: var(--navy); margin: 0 0 10px;
}
.login-wordmark span {
  background: linear-gradient(90deg, #3AA0FC, #1E38B0);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.login-card h1 { margin: 8px 0 4px; font-size: 26px; letter-spacing: -.03em; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-weight: 600; }
.login-foot { margin: 16px 0 0 !important; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }
.field { margin: 0 0 12px; }
.field label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #fff;
}
.field input:focus, .field select:focus, .field textarea:focus, .top-search input:focus, .search input:focus {
  outline: 2px solid rgba(26,95,212,.35); border-color: var(--accent);
}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 800; cursor: pointer; width: 100%;
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
.btn:hover { filter: brightness(1.03); transform: translateY(-1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(180deg, #2E86F0, #1658C7); color: #fff; box-shadow: 0 6px 14px rgba(26,95,212,.28); }
.btn-navy { background: linear-gradient(180deg, #1C3A73, #0A1328); color: #fff; }
.btn-ghost { background: #fff; border: 1.5px solid var(--line); color: var(--ink); }
.btn-danger { background: #FDECEC; color: var(--danger); }
.btn-ok { background: #E7F8F1; color: #066B4C; }
.btn-sm { width: auto; padding: 8px 12px; font-size: 13px; }
.ico-btn {
  width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.ico-btn.ok { background: #E7F8F1; color: #066B4C; }
.ico-btn.no { background: #FDECEC; color: var(--danger); }
.ico-btn.more { background: #F3F6FA; color: var(--ink); }
.ico-btn:hover { filter: brightness(.97); }
.mock { font-size: 11px; font-weight: 800; color: #8A5A00; background: #FFF6E0; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

/* Shell */
.shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.side {
  background: linear-gradient(180deg, #0A1328 0%, #0E1C3A 50%, #070E1C 100%); color: #D5DEE6;
  padding: 18px 12px 28px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand strong { display: block; color: #fff; font-size: 15px; letter-spacing: -.02em; }
.brand span { font-size: 11px; color: #8AA0B2; font-weight: 600; }
.nav-group { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6E8598;
  padding: 14px 12px 6px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; color: #D5DEE6; padding: 10px 12px; border-radius: 12px;
  font-weight: 700; font-size: 13.5px; cursor: pointer; position: relative;
}
.nav-btn svg { width: 18px; height: 18px; opacity: .9; }
.nav-btn .count {
  margin-left: auto; background: #F5B942; color: #3A2800; font-size: 10px; font-weight: 800;
  min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px;
}
.nav-btn.active, .nav-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-btn.active { background: linear-gradient(90deg, rgba(26,95,212,.28), rgba(26,95,212,.06)); color: #fff;
  box-shadow: inset 3px 0 0 #1A5FD4; }

.workspace { min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 14px 24px;
  background: rgba(255,255,255,.86); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 8;
}
.top-search {
  flex: 1; display: flex; align-items: center; gap: 8px; background: #F3F6FA;
  border: 1.5px solid var(--line); border-radius: 14px; padding: 0 12px; min-width: 0; max-width: 560px;
}
.top-search input { flex: 1; border: 0; background: transparent; padding: 10px 0; outline: none; min-width: 0; font-weight: 600; }
.top-search-ico { width: 16px; height: 16px; display: block; background: currentColor; color: #7A8A99;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3-3'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3-3'/></svg>") center / contain no-repeat;
}
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink);
  flex: 0 0 auto;
}
.icon-btn:hover { background: #F3F6FA; }
.bell-dot {
  position: absolute; top: -4px; right: -4px; background: #E03131; color: #fff; font-size: 9px; font-weight: 800;
  min-width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; border: 2px solid #fff;
}
.admin-chip { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 4px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); }
.admin-meta { display: flex; flex-direction: column; line-height: 1.15; padding-right: 6px; }
.admin-meta strong { font-size: 13px; }
.admin-meta span { font-size: 11px; color: var(--muted); font-weight: 600; }
.menu-btn { display: none; }

.notif-panel {
  position: absolute; right: 24px; top: 72px; width: min(360px, calc(100vw - 24px));
  background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); z-index: 20; padding: 8px;
}
.notif-panel h3 { margin: 8px 10px 6px; font-size: 14px; }
.notif-item { display: flex; gap: 10px; padding: 10px; border-radius: 12px; }
.notif-item:hover { background: #F3F6FA; }
.notif-item p { margin: 0; font-size: 13px; font-weight: 600; }
.notif-item span { font-size: 11px; color: var(--muted); font-weight: 600; }

.main { padding: 22px 24px 48px; min-width: 0; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
.eyebrow { margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Avatars */
.av {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 12px; color: #fff; flex: 0 0 auto; letter-spacing: -.02em;
}
.av-sm { width: 28px; height: 28px; font-size: 10px; }
.av-teal { background: linear-gradient(180deg, #2E86F0, #1658C7); color: #fff; }
.av-navy { background: linear-gradient(180deg, #2A4A8A, #0A1328); }
.av-blue { background: linear-gradient(180deg, #4BA0FF, #1877F2); }
.av-amber { background: linear-gradient(180deg, #FFD56A, #F0A202); color: #3A2800; }
.av-rose { background: linear-gradient(180deg, #FF8BA0, #E03131); }
.av-purple { background: linear-gradient(180deg, #B197FC, #7048E8); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .name { font-weight: 800; }
.who .sub { font-size: 12px; color: var(--muted); font-weight: 600; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi {
  position: relative; overflow: hidden; border-radius: 20px; padding: 16px 16px 14px;
  color: #fff; box-shadow: var(--shadow); min-height: 128px;
  display: flex; flex-direction: column;
}
.kpi::after {
  content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%;
  right: -36px; top: -48px; background: rgba(255,255,255,.12);
}
.kpi-ico {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.18); margin-bottom: 10px;
}
.kpi .n { font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.kpi .l { font-size: 13px; font-weight: 700; margin-top: 6px; opacity: .92; }
.kpi-trend {
  margin-top: auto; padding-top: 10px; font-size: 11px; font-weight: 800;
  display: inline-flex; align-items: center; gap: 4px;
}
.kpi-trend.up { color: #D4FFE9; }
.kpi-trend.flat { color: rgba(255,255,255,.85); }
.kpi-teal { background: linear-gradient(135deg, #4AA8FC, #1658C7); color: #fff; }
.kpi-teal .kpi-trend.up { color: #054C35; }
.kpi-navy { background: linear-gradient(135deg, #2A4A8A, #0A1328); }
.kpi-blue { background: linear-gradient(135deg, #4BA0FF, #1559C9); }
.kpi-amber { background: linear-gradient(135deg, #FFD56A, #E08A00); color: #3A2800; }
.kpi-amber .kpi-trend { color: #3A2800; }

/* Charts + layout */
.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 14px; }
.chart-card, .panel {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.chart-card { margin: 0; }
.panel { overflow: auto; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.panel h2, .chart-card h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
.panel-sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding: 8px 0 0; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; height: 100%; justify-content: flex-end; }
.bar {
  width: 100%; max-width: 28px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, #2E86F0, #1658C7); min-height: 6px;
}
.bar.alt { background: linear-gradient(180deg, #4BA0FF, #1877F2); }
.bar-col span { font-size: 10px; font-weight: 700; color: var(--muted); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
tbody tr:hover { background: #F8FAFC; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 800; }
.b-wait { background: #FFF6E0; color: #8A5A00; }
.b-ok { background: #E7F8F1; color: #066B4C; }
.b-no { background: #FDECEC; color: #9B2C2C; }
.b-info { background: #E8F1FD; color: #1559C9; }
.b-paid { background: #F3E8FF; color: #5F3DC4; }

.search { display: flex; gap: 8px; margin-bottom: 12px; }
.search input, .search select { flex: 1; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }

/* Activity + queue */
.feed { display: flex; flex-direction: column; gap: 0; }
.feed-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.feed-item:last-child { border-bottom: 0; }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; flex: 0 0 auto; background: var(--accent); }
.feed-dot.warn { background: #F0A202; }
.feed-dot.info { background: var(--fb); }
.feed-item p { margin: 0; font-size: 13px; font-weight: 700; }
.feed-item span { font-size: 11px; color: var(--muted); font-weight: 600; }
.queue-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.queue-row:last-child { border-bottom: 0; }
.pos {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: #F3F6FA; font-weight: 800; font-size: 12px; color: var(--navy);
}
.pos.paid { background: linear-gradient(180deg, #B197FC, #7048E8); color: #fff; }

/* Empty */
.empty {
  text-align: center; padding: 36px 16px; color: var(--muted);
}
.empty .empty-ico {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
  display: grid; place-items: center; background: linear-gradient(180deg, #E8F1FD, #F3F6FA); color: var(--accent-ink);
}
.empty h3 { margin: 0 0 4px; color: var(--ink); font-size: 16px; }
.empty p { margin: 0; font-weight: 600; font-size: 13px; }

/* Settings cards */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border: 0; }
.toggle { width: 44px; height: 26px; border-radius: 999px; background: #CDD5DD; position: relative; border: 0; cursor: pointer; flex: 0 0 auto; }
.toggle.on { background: linear-gradient(180deg, #2E86F0, #1658C7); }
.toggle i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on i { left: 21px; }
.price-tbc { font-size: 12px; font-weight: 800; color: #8A5A00; background: #FFF6E0; padding: 3px 8px; border-radius: 999px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #F3F6FA; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-weight: 800; }

.hidden { display: none !important; }
.overlay { position: fixed; inset: 0; background: rgba(8,16,28,.45); display: none; align-items: flex-end; justify-content: center; z-index: 40; }
.overlay.show { display: flex; }
.sheet { background: #fff; width: min(560px, 100%); border-radius: 20px 20px 0 0; padding: 18px; max-height: 86vh; overflow: auto; }
.backdrop { display: none; }

.bottom-nav { display: none; }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .admin-meta { display: none; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); height: 100vh;
    transform: translateX(-105%); transition: transform .2s; z-index: 30;
  }
  .side.open { transform: none; }
  .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .main { padding: 16px 14px calc(var(--bottom-nav) + 24px); }
  .topbar { padding: 10px 12px; }
  .notif-panel { right: 12px; top: 64px; }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
  td { border: 0; padding: 4px 0; }
  td::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  td[data-label=""]::before, td:has(.row-actions)::before { display: none; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); z-index: 15;
    padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .bnav {
    background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 800; color: #6B7A89; padding: 6px 2px; cursor: pointer; position: relative;
  }
  .bnav svg { width: 20px; height: 20px; }
  .bnav.active { color: #0A8F66; }
  .bnav .count {
    position: absolute; top: 2px; right: calc(50% - 18px); background: #E03131; color: #fff;
    font-size: 9px; min-width: 14px; height: 14px; border-radius: 999px; display: grid; place-items: center;
  }
}

.notif-ico {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex: none;
}
.notif-ico svg { width: 16px; height: 16px; display: block; }
.feed-item { align-items: flex-start; gap: 10px; }

.profile-extras { display: flex; flex-direction: column; gap: 12px; }
.profile-block { background: #fff; border: 1px solid var(--line, #D5DDE6); border-radius: 14px; padding: 14px 16px; }
.profile-h { margin: 0 0 8px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #8AA0B2; }
.profile-stat { margin-top: 10px; }
.profile-stat .k { display: block; font-size: 11px; font-weight: 800; color: #5B6B7C; }
.profile-stat .v { display: block; margin-top: 2px; font-size: 15px; font-weight: 800; }
.licence-list { margin: 8px 0 0; padding: 0 0 0 18px; }
.gal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.gal-tile { position: relative; aspect-ratio: 1; border: 0; border-radius: 14px; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 8px 6px; text-align: center; }
.gal-cap { font-size: 11px; font-weight: 800; }
.goal-row { margin-top: 10px; }
.goal-top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
.goal-bar { height: 8px; border-radius: 99px; background: #EEF2F6; overflow: hidden; margin-top: 6px; }
.goal-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg,#3AA0FC,#1A5FD4); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 800; background: #EEF2F6; }
.t-pill { background: #E8F1FD; color: #0D3F9C; }
.r-pill { background: #E8F1FD; color: #1C4B73; }

.admin-mem-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.admin-mem-chips label {

      parts.push('<section class="profile-block"><h3 class="profile-h">About my business</h3>' + aboutBits.join("") + "</section>");
    }

    var exp = [];
    if (p.specialties.length) exp.push('<div class="tags">' + chips(p.specialties, "t-pill") + "</div>");
    if (p.licences.length) {
      exp.push('<p class="profile-stat k" style="margin:10px 0 4px">Licences</p><ul class="licence-list">' + p.licences.map(function (l) { return "<li>" + esc(l) + "</li>"; }).join("") + "</ul>");
    }
    if (exp.length) parts.push('<section class="profile-block"><h3 class="profile-h">Expertise</h3>' + exp.join("") + "</section>");

    if (p.gallery.length || mine) {
      var add = mine
        ? '<div class="gal-cell"><button type="button" class="gal-tile gal-add" data-action="gal-add" data-id="' + esa(mid) + '"><span class="gal-ico" aria-hidden="true">+</span><span class="gal-cap">Add photo</span></button></div>'
        : "";
      var emptyGal = !p.gallery.length ? '<p class="hint" style="margin:0 0 8px">No job photos yet. Add a few so other members can see the kind of work you do. These are placeholders in the prototype.</p>' : "";
      parts.push('<section class="profile-block"><h3 class="profile-h">Image gallery</h3>' + emptyGal +
        '<div class="gal-grid">' + p.gallery.map(function (g, i) { return galleryTile(g, i, mid, mine); }).join("") + add + "</div>" +
        (mine ? '<p class="hint">Photos are placeholders in this prototype. Tap a tile to view it full screen. Add or remove is a mock only.</p>' : "") +
        "</section>");
    }

    if (p.idealTrades.length || p.idealNote) {
      parts.push('<section class="profile-block"><h3 class="profile-h">My ideal referral partner</h3>' +
        (p.idealTrades.length ? '<div class="tags">' + chips(p.idealTrades, "t-pill") + "</div>" : "") +
        (p.idealNote ? '<p class="ideal-note">' + esc(p.idealNote) + "</p>" : "") +
        "</section>");
    }

    if (p.goals.length) {
      var rows = p.goals.map(function (g) {
        var pct = g.target ? Math.max(0, Math.min(100, Math.round((g.current / g.target) * 100))) : 0;
        var done = g.target && g.current >= g.target;
        return '<div class="goal-row' + (done ? " done" : "") + '"><div class="goal-top"><span>' + esc(g.label) + "</span><strong>" + g.current + " of " + g.target + "</strong></div>" +
          '<div class="goal-bar" role="progressbar" aria-valuenow="' + g.current + '" aria-valuemin="0" aria-valuemax="' + g.target + '"><i style="width:' + pct + '%"></i></div></div>';
      }).join("");
      parts.push('<section class="profile-block"><h3 class="profile-h">My goals</h3>' + rows + "</section>");
    }

    if (!parts.length) return "";
    return '<div class="profile-extras">' + parts.join("") + "</div>";
  }

  function chipToggle(name, value, on) {
    return '<button type="button" class="chip' + (on ? " active" : "") + '" data-profile-chip="' + esa(name) + '" data-value="' + esa(value) + '">' + esc(value) + "</button>";
  }

  function editFields(p) {
    p = normalize(p);
    function csv(arr) { return (arr || []).join(", "); }
    var goalRows = (p.goals.length ? p.goals : [{ label: "", current: "", target: "" }]).map(function (g, i) {
      return '<div class="goal-edit field" data-goal-row>' +
        '<input data-goal="label" placeholder="Goal, e.g. Meet 5 new tradies" value="' + esa(g.label || "") + '">' +
        '<div class="goal-nums"><input data-goal="current" inputmode="numeric" placeholder="Now" value="' + esa(g.current === 0 || g.current ? g.current : "") + '">' +
        '<span>of</span>' +
        '<input data-goal="target" inputmode="numeric" placeholder="Target" value="' + esa(g.target || "") + '"></div></div>';
    }).join("");
    return '<div class="profile-edit" data-profile-edit="1">' +
      '<p class="group-label">About my business <span class="opt">(optional)</span></p>' +
      '<div class="field"><label>Years in business</label><input name="profileYears" inputmode="numeric" placeholder="e.g. 10" value="' + esa(p.years) + '"></div>' +
      '<div class="field"><label>Service areas</label><input name="profileAreas" placeholder="Suburbs, separated by commas" value="' + esa(csv(p.serviceAreas)) + '">' +
      '<div class="chips chips-tight" style="margin-top:8px">' + SUBURBS.map(function (s) { return chipToggle("serviceAreas", s, p.serviceAreas.indexOf(s) !== -1); }).join("") + "</div></div>" +
      '<p class="group-label">Expertise <span class="opt">(optional)</span></p>' +
      '<p class="hint" style="margin-top:0">Search and add the work you are known for. You can also type your own.</p>' +
      (root.TC158 && TC158.pickerHTML
        ? TC158.pickerHTML("specialties", "profileSpecialties", p.specialties, "Search services, e.g. Termite inspections")
        : '<div class="field"><label>Specialties</label><input name="profileSpecialties" placeholder="e.g. Termite inspections, Decks" value="' + esa(csv(p.specialties)) + '"></div>') +
      '<div class="field"><label>Licences</label><textarea name="profileLicences" rows="2" placeholder="One licence per line">' + esc(p.licences.join("\n")) + "</textarea></div>" +
      '<p class="group-label">My ideal referral partner <span class="opt">(optional)</span></p>' +
      '<p class="hint" style="margin-top:0">Search from 456 business types, or type your own.</p>' +
      (root.TC158 && TC158.pickerHTML
        ? TC158.pickerHTML("idealTrades", "profileIdealTrades", p.idealTrades, "Search business types, e.g. Carpenter")
        : ('<div class="chips chips-tight">' + TRADE_CHIPS.map(function (s) { return chipToggle("idealTrades", s, p.idealTrades.indexOf(s) !== -1); }).join("") + "</div>" +
          '<input type="hidden" name="profileIdealTrades" value="' + esa(csv(p.idealTrades)) + '">')) +
      '<div class="field" style="margin-top:8px"><label>A short sentence</label><textarea name="profileIdealNote" rows="2" placeholder="Who you like to work with, and why">' + esc(p.idealNote) + "</textarea></div>" +
      '<p class="group-label">My goals <span class="opt">(optional)</span></p>' +
      '<div data-goal-list>' + goalRows + "</div>" +
      '<button type="button" class="btn btn-ghost ink" data-action="add-goal" style="margin:4px 0 12px">Add a goal</button>' +
      '<p class="hint">Job photos can be added or removed on My profile. These fields are optional and you can leave them blank.</p>' +
      "</div>";
  }

  function collect(form, current) {
    var p = normalize(current);
    if (!form) return p;
    var years = form.querySelector("[name='profileYears']");
    var areas = form.querySelector("[name='profileAreas']");
    var spec = form.querySelector("[name='profileSpecialties']");
    var lic = form.querySelector("[name='profileLicences']");
    var note = form.querySelector("[name='profileIdealNote']");
    var idealHid = form.querySelector("[name='profileIdealTrades']");
    if (years) p.years = String(years.value || "").trim();
    var about = form.querySelector("[name='profileAbout']");
    var goal = form.querySelector("[name='profileGoal']");
    if (about) p.about = String(about.value || "").trim();
    if (goal) p.goal = String(goal.value || "").trim();
    if (areas) p.serviceAreas = list(areas.value);
    if (spec) p.specialties = list(spec.value);
    if (lic) p.licences = list(lic.value);
    if (note) p.idealNote = String(note.value || "").trim();
    if (idealHid) p.idealTrades = list(idealHid.value);
    var goals = [];
    form.querySelectorAll("[data-goal-row]").forEach(function (row) {
      var label = (row.querySelector("[data-goal='label']") || {}).value || "";
      if (!String(label).trim()) return;
      goals.push({
        label: String(label).trim(),
        current: Number((row.querySelector("[data-goal='current']") || {}).value) || 0,
        target: Number((row.querySelector("[data-goal='target']") || {}).value) || 0
      });
    });
    if (form.querySelector("[data-goal-row]")) p.goals = goals;
    return p;
  }

  function syncChipInput(form, name, hiddenName, joinedInto) {
    var selected = [];
    form.querySelectorAll('[data-profile-chip="' + name + '"].active').forEach(function (b) {
      selected.push(b.getAttribute("data-value"));
    });
    var hid = form.querySelector("[name='" + (hiddenName || "") + "']");
    if (hid) hid.value = selected.join(", ");
    var inp = form.querySelector("[name='" + (joinedInto || "") + "']");
    if (inp && name === "serviceAreas") {
      var typed = list(inp.value);
      selected.forEach(function (s) { if (typed.indexOf(s) === -1) typed.push(s); });
      /* also drop unchecked suburbs that were only from chips */
      inp.value = typed.filter(function (s) {
        if (SUBURBS.indexOf(s) === -1) return true;
        return selected.indexOf(s) !== -1;
      }).join(", ");
    }
  }

  function bindForm(form) {
    if (!form || form.getAttribute("data-profile-bound") === "1") return;
    form.setAttribute("data-profile-bound", "1");
    if (root.TC158 && TC158.bindSearchPickers) TC158.bindSearchPickers(form);
    form.addEventListener("click", function (e) {
      var chip = e.target.closest("[data-profile-chip]");
      if (chip) {
        e.preventDefault();
        chip.classList.toggle("active");
        var name = chip.getAttribute("data-profile-chip");
        if (name === "serviceAreas") syncChipInput(form, name, "", "profileAreas");
        if (name === "idealTrades") syncChipInput(form, name, "profileIdealTrades", "");
        if (name === "specialties") syncChipInput(form, name, "", "profileSpecialties");
      }
      if (e.target.closest("[data-action='add-goal']")) {
        e.preventDefault();
        var listEl = form.querySelector("[data-goal-list]");
        if (listEl) listEl.insertAdjacentHTML("beforeend",
          '<div class="goal-edit field" data-goal-row><input data-goal="label" placeholder="Goal, e.g. Meet 5 new tradies" value="">' +
          '<div class="goal-nums"><input data-goal="current" inputmode="numeric" placeholder="Now" value=""><span>of</span>' +
          '<input data-goal="target" inputmode="numeric" placeholder="Target" value=""></div></div>');
      }
    });
  }

  var viewer = { open: false, mid: "", index: 0, items: [] };

  function closeViewer() {
    var el = document.getElementById("galleryViewer");
    if (el) el.remove();
    viewer.open = false;
  }

  function renderViewer() {
    var el = document.getElementById("galleryViewer");
    if (!el || !viewer.items.length) return;
    var i = viewer.index;
    var item = viewer.items[i];
    var bg = TONES[item.tone] || TONES.teal;
    var ico = ICONS[item.icon] || ICONS.house;
    el.querySelector(".gal-view-stage").style.background = bg;
    el.querySelector(".gal-view-ico").innerHTML = ico;
    el.querySelector(".gal-view-title").textContent = item.title;
    el.querySelector(".gal-view-count").textContent = (i + 1) + " of " + viewer.items.length;
    el.querySelector("[data-action='gal-prev']").disabled = viewer.items.length < 2;
    el.querySelector("[data-action='gal-next']").disabled = viewer.items.length < 2;
  }

  function openViewer(mid, index) {
    var m = null;
    try { m = (window.TradeCircle && TradeCircle.MEMBERS || []).filter(function (x) { return x.id === mid; })[0]; } catch (e) {}
    var items = fromMember(m).gallery;
    if (!items.length) return;
    viewer.mid = mid;
    viewer.items = items;
    viewer.index = Math.max(0, Math.min(items.length - 1, Number(index) || 0));
    viewer.open = true;
    closeViewer();
    viewer.open = true;
    var host = document.getElementById("phone") || document.body;
    var wrap = document.createElement("div");
    wrap.id = "galleryViewer";
    wrap.className = "gal-viewer";
    wrap.innerHTML = '<div class="gal-view-panel">' +
      '<button type="button" class="gal-view-close" data-action="gal-close" aria-label="Close">Close</button>' +
      '<div class="gal-view-stage"><span class="gal-view-ico" aria-hidden="true"></span></div>' +
      '<div class="gal-view-meta"><div class="gal-view-title"></div><div class="gal-view-count"></div></div>' +
      '<div class="gal-view-nav"><button type="button" data-action="gal-prev">Previous</button>' +
      '<button type="button" data-action="gal-next">Next</button></div></div>';
    host.appendChild(wrap);
    renderViewer();
    var startX = 0, startY = 0, tracking = false;
    var stage = wrap.querySelector(".gal-view-stage");
    function onStart(ev) {
      var t = ev.touches ? ev.touches[0] : ev;
      startX = t.clientX; startY = t.clientY; tracking = true;
    }
    function onEnd(ev) {
      if (!tracking) return;
      tracking = false;
      var t = ev.changedTouches ? ev.changedTouches[0] : ev;
      var dx = t.clientX - startX, dy = t.clientY - startY;
      if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) step(1); else step(-1);
      }
    }
    stage.addEventListener("touchstart", onStart, { passive: true });
    stage.addEventListener("touchend", onEnd);
    stage.addEventListener("pointerdown", onStart);
    stage.addEventListener("pointerup", onEnd);
  }

  function step(dir) {
    if (!viewer.items.length) return;
    viewer.index = (viewer.index + dir + viewer.items.length) % viewer.items.length;
    renderViewer();
  }

  var ADD_POOL = [
    tile("On-site work", "navy", "wrench"),
    tile("Finished job", "teal", "house"),
    tile("Before and after", "amber", "paint"),
    tile("Detail shot", "moss", "leaf"),
    tile("Workshop", "coral", "wrench")
  ];

  function addPhoto(m) {
    if (!m) return;
    var p = fromMember(m);
    var used = p.gallery.map(function (g) { return g.title; });
    var next = ADD_POOL.filter(function (t) { return used.indexOf(t.title) === -1; })[0] || tile("Job photo " + (p.gallery.length + 1), "sky", "house");
    next = { id: "g" + Date.now(), title: next.title, tone: next.tone, icon: next.icon };
    p.gallery.push(next);
    applyToMember(m, p);
  }

  function removePhoto(m, gid) {
    if (!m) return;
    var p = fromMember(m);
    p.gallery = p.gallery.filter(function (g) { return g.id !== gid; });
    applyToMember(m, p);
  }

  function adminHTML(m) {
    return viewHTML(m, { mine: false });
  }

  root.TCProfile = {
    empty: empty,
    normalize: normalize,
    fromMember: fromMember,
    applyToMember: applyToMember,
    hydrate: hydrate,
    seedFor: seedFor,
    viewHTML: viewHTML,
    editFields: editFields,
    collect: collect,
    bindForm: bindForm,
    openViewer: openViewer,
    closeViewer: closeViewer,
    step: step,
    addPhoto: addPhoto,
    removePhoto: removePhoto,
    adminHTML: adminHTML,
    SUBURBS: SUBURBS
  };
})(typeof window !== "undefined" ? window : global);

</script>
  <script>
/* devi-city.js */
/* Rate Buddies v1.8.0 — map a place to its city, and work out who is alerted.
   Rule: alert every member in that city, except members of the same trade
   (conflict of interest). A member of the requested trade is featured
   so others can recommend them. Fictional demo data only. */
(function (root) {
  "use strict";

  /* Metro regions in each state belong to one city (the capital, or a
     named second city such as the Gold Coast). Regional areas use the
     main town or city in that region. */
  var METRO_CITY = {
    nsw: "Sydney", vic: "Melbourne", sa: "Adelaide", tas: "Hobart",
    act: "Canberra", wa: "Perth", nt: "Darwin"
  };
  var QLD_METRO_CITY = {
    "gold coast": "Gold Coast",
    "sunshine coast": "Sunshine Coast"
  };
  var REGIONAL_CITY = {
    "wa-peel": "Mandurah",
    "wa-south-west": "Bunbury",
    "wa-great-southern": "Albany",
    "wa-wheatbelt": "Northam",
    "wa-goldfields-esperance": "Kalgoorlie",
    "wa-mid-west": "Geraldton",
    "wa-gascoyne": "Carnarvon",
    "wa-pilbara": "Karratha",
    "wa-kimberley": "Broome",
    "nsw-newcastle-lake-macquarie": "Newcastle",
    "nsw-illawarra": "Wollongong",
    "nsw-central-coast": "Central Coast",
    "vic-geelong-bellarine-surf-coast": "Geelong",
    "vic-ballarat": "Ballarat",
    "vic-bendigo": "Bendigo",
    "qld-cairns-far-north": "Cairns",
    "qld-townsville": "Townsville",
    "qld-toowoomba": "Toowoomba",
    "tas-launceston-north-east": "Launceston",
    "nt-alice-springs-central-australia": "Alice Springs"
  };
  /* Common suburbs and towns used in posts, mapped to a city. */
  var PLACE_CITY = {
    perth: "Perth", joondalup: "Perth", mullaloo: "Perth", midland: "Perth",
    kalamunda: "Perth", fremantle: "Perth", warwick: "Perth", stirling: "Perth",
    "osborne park": "Perth", ellenbrook: "Perth", armadale: "Perth",
    rockingham: "Perth", kwinana: "Perth", mundaring: "Perth", hills: "Perth",
    north: "Perth", south: "Perth", east: "Perth", "central / cbd": "Perth",
    central: "Perth", cbd: "Perth",
    broome: "Broome", bunbury: "Bunbury", albany: "Albany", mandurah: "Mandurah",
    geraldton: "Geraldton", kalgoorlie: "Kalgoorlie", karratha: "Karratha",
    sydney: "Sydney", melbourne: "Melbourne", brisbane: "Brisbane",
    adelaide: "Adelaide", hobart: "Hobart", canberra: "Canberra",
    darwin: "Darwin"
  };
  var WA_METRO_IDS = {
    hills: 1, kwinana: 1, north: 1, south: 1, east: 1, central: 1,
    fremantle: 1, rockingham: 1, joondalup: 1, armadale: 1
  };

  function norm(s) {
    return String(s || "").toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]+/g, " ").trim();
  }

  function lookupRegion(place) {
    var loc = root.TC_LOCATIONS;
    if (!loc || !loc.states) return null;
    var n = norm(place);
    var i, j, st, r, rn;
    for (i = 0; i < loc.states.length; i++) {
      st = loc.states[i];
      for (j = 0; j < st.regions.length; j++) {
        r = st.regions[j];
        rn = norm(r.name);
        if (r.id === place || rn === n || n.indexOf(rn) !== -1 || rn.indexOf(n) !== -1) {
          return { region: r, state: st };
        }
      }
    }
    return null;
  }

  function cityForPlace(place) {
    var n = norm(place);
    if (!n) return { city: "", place: place || "" };
    if (PLACE_CITY[n]) return { city: PLACE_CITY[n], place: place };
    /* "joondalup home owners", "perth hills" etc. */
    var key;
    for (key in PLACE_CITY) {
      if (n.indexOf(key) !== -1) return { city: PLACE_CITY[key], place: place };
    }
    if (REGIONAL_CITY[n] || REGIONAL_CITY[place]) {
      return { city: REGIONAL_CITY[n] || REGIONAL_CITY[place], place: place };
    }
    var hit = lookupRegion(place);
    if (hit) {
      if (REGIONAL_CITY[hit.region.id]) return { city: REGIONAL_CITY[hit.region.id], place: place, region: hit.region, state: hit.state };
      if (hit.region.type === "metro") {
        if (hit.state.id === "qld") {
          var rn = norm(hit.region.name);
          if (rn.indexOf("gold coast") !== -1) return { city: "Gold Coast", place: place, region: hit.region, state: hit.state };
          if (rn.indexOf("sunshine coast") !== -1) return { city: "Sunshine Coast", place: place, region: hit.region, state: hit.state };
          return { city: "Brisbane", place: place, region: hit.region, state: hit.state };
        }
        if (METRO_CITY[hit.state.id]) return { city: METRO_CITY[hit.state.id], place: place, region: hit.region, state: hit.state };
      }
      /* unnamed regional: use the region name as the city label */
      return { city: hit.region.name, place: place, region: hit.region, state: hit.state };
    }
    return { city: place, place: place };
  }

  function cityForRegionId(id) {
    if (WA_METRO_IDS[id]) return "Perth";
    if (REGIONAL_CITY[id]) return REGIONAL_CITY[id];
    return cityForPlace(id).city;
  }

  /* Canonical fictional circle used to count alerts in the prototype. */
  var CIRCLE = [
    { id: "jamie", first: "Jamie", last: "Hale", business: "Hale Pest Control", trade: "Pest Control", regions: ["hills", "north"], city: "Perth" },
    { id: "sarah", first: "Sarah", last: "Nguyen", business: "Nguyen Carpentry", trade: "Carpenter", regions: ["north", "joondalup"], city: "Perth" },
    { id: "liam", first: "Liam", last: "O’Connor", business: "O’Connor Plumbing", trade: "Plumber", regions: ["south", "fremantle"], city: "Perth" },
    { id: "priya", first: "Priya", last: "Sharma", business: "Sharma Painting Co", trade: "Painter", regions: ["east", "central"], city: "Perth" },
    { id: "jack", first: "Jack", last: "Thompson", business: "Thompson Electrical", trade: "Electrician", regions: ["kwinana", "rockingham"], city: "Perth" },
    { id: "mei", first: "Mei", last: "Chen", business: "West Coast Gardens", trade: "Landscaper", regions: ["hills", "east"], city: "Perth" },
    { id: "daniel", first: "Daniel", last: "Walsh", business: "Walsh Roofing", trade: "Roofer", regions: ["armadale", "south"], city: "Perth" },
    { id: "emma", first: "Emma", last: "Brooks", business: "Brooks Air & Gas", trade: "Air Conditioning", regions: ["north", "central"], city: "Perth" },
    { id: "marcus", first: "Marcus", last: "Adeyemi", business: "Adeyemi Tiling", trade: "Tiler", regions: ["fremantle", "south"], city: "Perth" },
    { id: "tom", first: "Tom", last: "Reeves", business: "Reeves Fencing", trade: "Fencer", regions: ["hills", "armadale"], city: "Perth" },
    { id: "hannah", first: "Hannah", last: "Lewis", business: "Lewis Handyman", trade: "Handyman", regions: ["central", "east"], city: "Perth" },
    { id: "chris", first: "Chris", last: "Patel", business: "Patel Locksmiths", trade: "Locksmith", regions: ["joondalup", "north"], city: "Perth" },
    { id: "noah", first: "Noah", last: "Barrett", business: "Barrett Barbers", trade: "Barber", regions: ["fremantle", "south"], city: "Perth" },
    { id: "michael", first: "Michael", last: "Shaw", business: "Shaw Plumbing", trade: "Plumber", regions: ["joondalup", "north"], city: "Perth" }
  ];

  function firstName(m) {
    if (m.first) return m.first;
    return String(m.name || "").split(" ")[0] || "them";
  }
  function fullName(m) {
    if (m.first) return (m.first + " " + (m.last || "")).trim();
    return m.name || "";
  }
  function tradesMatch(a, b) {
    return norm(a) === norm(b);
  }
  function memberCity(m) {
    if (m.city) return m.city;
    var regs = m.regions || [];
    var i;
    for (i = 0; i < regs.length; i++) {
      var c = cityForRegionId(regs[i]);
      if (c) return c;
    }
    if (m.areas) return cityForPlace(String(m.areas).split(",")[0]).city;
    return "";
  }
  function inCity(m, city) {

    var actions = '<div class="devi-top-actions">' +
      '<button class="btn btn-primary" type="button" data-action="devi-simulate">Simulate Devi alert</button>' +
      '<button class="btn btn-ghost" type="button" data-page="devi-inbox">Open incoming requests' +
      (pendingCount() ? " (" + pendingCount() + ")" : "") + "</button></div>";

    return (flash ? '<div class="devi-toast">' + esc(flash) + "</div>" : "") + actions +
      '<div class="devi-grid two">' + status + channels + "</div>" +
      '<div class="devi-grid two" style="margin-top:16px">' + rules + keys + "</div>";
  }

  function renderInbox() {
    var pending = inbox.filter(function (x) { return x.status === "pending"; });
    var done = inbox.filter(function (x) { return x.status !== "pending"; });
    var tools = '<div class="devi-toolbar">' +
      '<button class="btn btn-primary btn-sm" type="button" data-action="devi-simulate">Simulate Devi alert</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-page="devi">Devi settings</button>' +
      '<span class="panel-sub" style="margin:0">' + pending.length + " waiting for your approval</span></div>";

    function card(item) {
      var s = stats(item);
      var feat = s.featured;
      var canApprove = !!(feat && s.alertCount >= 0 && feat);
      var cls = "devi-card";
      if (item.status === "approved") cls += " is-approved";
      if (item.status === "dismissed") cls += " is-dismissed";
      if (item.low) cls += " is-low";
      if (!feat) cls += " is-none";
      var stLab = item.status === "pending" ? badge("pending") : item.status === "approved" ? badge("approved") : badge("declined");
      var memberLine;
      if (!feat) {
        memberLine = '<span class="pill">No ' + esc(item.trade) + " in " + esc(item.city) + " to recommend</span>";
      } else {
        memberLine = '<span class="pill">' + s.alertCount + " " + esc(item.city) + " members will be alerted · " +
          esc(plural(item.trade)) + " excluded</span>";
      }
      var featuredHtml = "";
      if (feat) {
        var change = "";
        if (item.status === "pending" && s.candidates && s.candidates.length > 1) {
          change = '<select data-action="devi-feature" data-id="' + item.id + '" style="margin-left:auto;font:inherit;font-weight:700;border:1.5px solid var(--line,#D5DDE6);border-radius:10px;padding:6px 8px;background:#fff">' +
            s.candidates.map(function (m) {
              return '<option value="' + m.id + '"' + (m.id === feat.id ? " selected" : "") + ">" + esc(fullName(m)) + "</option>";
            }).join("") + "</select>";
        } else if (item.status === "pending" && s.candidates && s.candidates.length === 1) {
          change = '<span class="devi-note" style="margin:0 0 0 auto">Only one ' + esc(item.trade.toLowerCase()) + " in " + esc(item.city) + "</span>";
        }
        featuredHtml = '<div class="devi-featured"><div class="av av-navy" style="width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#2E86F0,#1658C7);color:#fff;font-weight:800;font-size:12px">' +
          esc(initials(feat)) + '</div><div class="feat-meta"><strong>Featured: ' + esc(fullName(feat)) + "</strong><span>" +
          esc(feat.business) + " · Let’s help " + esc(firstName(feat)) + "</span></div>" + change + "</div>";
        if (item.featuredId === "jamie" || feat.id === "jamie") {
          featuredHtml += '<p class="devi-note" style="margin:-4px 0 12px">Jamie Hale (Pest Control) is featured, so this alert is not sent to Jamie or any other pest controller.</p>';
        }
      }
      var actions = "";
      if (item.status === "pending") {
        var disable = !feat ? " disabled title=\"No member of this trade in this city\"" : "";
        actions = '<div class="devi-actions">' +
          '<button class="btn btn-primary" type="button" data-action="devi-approve" data-id="' + item.id + '"' + disable + ">Approve &amp; alert</button>" +
          '<button class="btn btn-ghost" type="button" data-action="devi-edit" data-id="' + item.id + '">Edit trade or city</button>' +
          '<button class="btn btn-ghost" type="button" data-action="devi-dismiss" data-id="' + item.id + '">Dismiss</button></div>' +
          '<div class="approve-link">Approve link · https://api.ratebuddies.com/hooks/approve/' + esc(item.id) + "?token=" + esc(item.token) + "</div>";
      } else if (item.status === "approved") {
        actions = '<p class="devi-note" style="margin:0">Approved' + (item.approvedAt ? " · " + esc(item.approvedAt) : "") +
          ". Published to the Recommend feed. " + s.alertCount + " " + esc(item.city) + " members were asked to recommend " +
          (feat ? esc(firstName(feat)) : "the featured member") + ". (Prototype only.)</p>";
      } else {
        actions = '<p class="devi-note" style="margin:0">Dismissed. Members were not notified.</p>';
      }
      var edit = "";
      if (editing === item.id) {
        edit = '<div class="devi-edit">' +
          '<div class="field"><label>Trade wanted</label><input id="editTrade" type="text" value="' + esc(item.trade) + '"></div>' +
          '<div class="field"><label>City</label><input id="editCity" type="text" value="' + esc(item.city) + '"></div>' +
          '<button class="btn btn-primary btn-sm" type="button" data-action="devi-save-edit" data-id="' + item.id + '">Save</button></div>';
      }
      return '<article class="' + cls + '"><div class="devi-card-top"><div>' +
        '<div class="group">' + facebookF(14, "#1877F2") + " " + esc(item.group) + "</div>" +
        '<div class="when">' + esc(item.when) + " · keyword “" + esc(item.keyword) + "”</div></div>" + stLab + "</div>" +
        '<p class="snippet">“' + esc(item.snippet) + '”</p>' +
        '<div class="devi-meta"><span class="pill trade">' + esc(item.trade) + " wanted</span>" +
        '<span class="pill">' + esc(item.city) + "</span>" +
        confBadge(item.confidence) + memberLine + "</div>" +
        '<p class="devi-place">Post mentions ' + esc(item.place) + "</p>" +
        featuredHtml + actions + edit + "</article>";
    }

    return (flash ? '<div class="devi-toast">' + esc(flash) + "</div>" : "") + tools +
      panel("Waiting for you", "Tap Approve and the request is published automatically. Members in that city (except the same trade) are asked to recommend the featured member. You do not need any further admin steps.", "",
        pending.length ? pending.map(card).join("") : '<p class="panel-sub">Nothing waiting. Use Simulate Devi alert to try a new match.</p>') +
      (done.length ? '<div style="height:16px"></div>' + panel("Already handled", "", "", done.map(card).join("")) : "");
  }

  function approve(id) {
    var item = inbox.filter(function (x) { return x.id === id; })[0];
    if (!item) return "Could not find that match.";
    var s = stats(item);
    if (!s.featured) return "There is no " + item.trade.toLowerCase() + " in " + item.city + " to recommend, so this can’t be approved.";
    item.status = "approved";
    item.approvedAt = "Just now";
    return "Approved. The request is in the Recommend feed. " + s.alertCount + " " + item.city +
      " members have been asked to recommend " + firstName(s.featured) + ". " +
      (s.sameTradeCount ? (s.sameTradeCount + " " + plural(item.trade) + " were not alerted.") : "");
  }

  function pageHTML(page) {
    if (page === "devi") return renderConnection();
    if (page === "devi-inbox") return renderInbox();
    return null;
  }

  function handle(a, id, btn, e) {
    if (a === "devi-copy-hook") {
      var inp = document.getElementById("deviWebhook");
      if (inp) {
        inp.select();
        try { navigator.clipboard.writeText(inp.value); } catch (err) {}
      }
      flash = "Placeholder webhook copied. It will work once the backend is live.";
      return true;
    }
    if (a === "devi-channel") {
      settings.channels[id] = !settings.channels[id];
      if (!settings.channels.grok && !settings.channels.email && !settings.channels.sms && !settings.channels.push) {
        settings.channels.grok = true;
        flash = "At least one approval channel has to stay on. Grok Bot is selected.";
      } else {
        flash = "";
      }
      return true;
    }
    if (a === "devi-mode") {
      settings.autoPublish = id === "auto";
      flash = settings.autoPublish
        ? "High-confidence matches will publish on their own. You can still review the rest in Incoming requests."
        : "Review first is on. You’ll get an Approve card for each match.";
      return true;
    }
    if (a === "devi-approve") {
      flash = approve(id);
      editing = null;
      return true;
    }
    if (a === "devi-dismiss") {
      inbox.forEach(function (x) { if (x.id === id) x.status = "dismissed"; });
      flash = "Dismissed. Members were not notified.";
      editing = null;
      return true;
    }
    if (a === "devi-edit") {
      editing = editing === id ? null : id;
      flash = "";
      return true;
    }
    if (a === "devi-save-edit") {
      var item = inbox.filter(function (x) { return x.id === id; })[0];
      var trade = document.getElementById("editTrade");
      var city = document.getElementById("editCity");
      if (item && trade && city) {
        item.trade = trade.value.trim() || item.trade;
        item.city = city.value.trim() || item.city;
        item.low = false;
        var s = stats(item);
        item.featuredId = s.featured ? s.featured.id : "";
      }
      editing = null;
      flash = "Trade and city updated. You can Approve & alert when you’re happy.";
      return true;
    }
    if (a === "devi-feature") {
      var it = inbox.filter(function (x) { return x.id === id; })[0];
      var val = btn && btn.value;
      if (it && val && it.featuredId !== val) {
        it.featuredId = val;
        var picked = stats(it).featured;
        flash = "Featured member set to " + (picked ? fullName(picked) : val) + ". Members will be asked to recommend " + (picked ? firstName(picked) : "them") + ".";
      }
      return true;
    }
    if (a === "devi-simulate") {
      simN += 1;
      var clone = {
        id: "d-sim-" + simN,
        status: "pending",
        group: "Stirling Community Board (demo)",
        snippet: "Does anyone have a locksmith they trust in Osborne Park? Locked out this afternoon.",
        keyword: "locksmith",
        trade: "Locksmith",
        place: "Osborne Park",
        city: cityOf("Osborne Park") || "Perth",
        featuredId: "chris",
        confidence: 88,
        link: "https://www.facebook.com/groups/stirling.community.demo/posts/551902",
        when: "Just now",
        token: "demo-sim-" + simN
      };
      var s2 = stats(clone);
      var auto = settings.autoPublish && clone.confidence >= settings.minConfidence && s2.featured;
      if (auto) {
        clone.status = "approved";
        clone.approvedAt = "Just now";
        flash = "Simulated Devi alert auto-published. " + s2.alertCount + " " + clone.city +
          " members were asked to recommend " + firstName(s2.featured) + ".";
      } else {
        var via = [];
        if (settings.channels.grok) via.push("Grok Bot");
        if (settings.channels.email) via.push("email");
        if (settings.channels.sms) via.push("SMS");
        if (settings.channels.push) via.push("push");
        flash = "Simulated Devi alert received. An Approve card was sent via " + via.join(", ") +
          " to recommend " + (s2.featured ? firstName(s2.featured) : "the featured member") +
          ". Nothing is published until you approve.";
      }
      inbox.unshift(clone);
      settings.lastAlert = "Just now";
      return true;
    }
    return false;
  }

  function attach() {
    document.addEventListener("input", function (e) {
      if (e.target && e.target.id === "deviMinConf") {
        settings.minConfidence = Number(e.target.value) || 70;
        var lab = document.getElementById("deviMinConfVal");
        if (lab) lab.textContent = settings.minConfidence + "%";
      }
    });
    document.addEventListener("change", function (e) {
      var el = e.target.closest("[data-action='devi-feature']");
      if (!el) return;
      if (window.TC180Admin && TC180Admin.handle) {
        if (TC180Admin.handle("devi-feature", el.getAttribute("data-id"), el, e)) {
          if (window.TCAdmin && TCAdmin.paint) TCAdmin.paint();
        }
      }
    });
  }

  window.TC180Admin = {
    pageHTML: pageHTML,
    handle: handle,
    pendingCount: pendingCount,
    attach: attach,
    settings: settings,
    inbox: inbox,
    grokBlurb: grokBlurb
  };
})();

</script>
  <script>
/* admin-v181.js */
/* Rate Buddies v1.8.2 — Video tutorials admin (intro is the first pinned section). */
(function () {
  "use strict";
  function esc(s) {
    if (window.TCAdmin && TCAdmin.esc) return TCAdmin.esc(s);
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function panel(title, sub, extra, body) {
    if (window.TCAdmin && TCAdmin.panel) return TCAdmin.panel(title, sub, extra, body);
    return '<section class="panel"><div class="panel-h"><div><h2>' + title + "</h2>" + (sub ? '<p class="panel-sub">' + sub + "</p>" : "") + "</div>" + (extra || "") + "</div>" + body + "</section>";
  }
  function Tut() { return window.TCTutorials; }
  function data() { return Tut().load(); }
  var flash = "";
  var editingVideo = null;
  var formDraft = { url: "", title: "", description: "", sectionId: "getting-started", duration: "" };
  var introDraft = null;

  function membersList() {
    var circle = (window.TCDeviCity && TCDeviCity.CIRCLE) || [];
    if (circle.length) return circle;
    return (window.TCAdmin && TCAdmin.members) || [];
  }
  function watchedMap() { return Tut().loadIntroWatched(); }

  function parseOrNull(url) { return Tut().parseVideoUrl(url); }

  function thumb(src) {
    return src ? '<img src="' + esc(src) + '" alt="" width="160" height="90" style="width:160px;height:90px;object-fit:cover;border-radius:10px;background:#0A1328">' : '<div style="width:160px;height:90px;border-radius:10px;background:#0A1328"></div>';
  }

  function introPanel() {
    var d = data();
    var v = d.intro || {};
    var draft = introDraft || { url: v.url || "", title: v.title || "", description: v.description || "", duration: v.duration || "" };
    var parsed = parseOrNull(draft.url) || v;
    var map = watchedMap();
    var list = membersList();
    var yes = 0, no = 0, i, mid, rows = "";
    for (i = 0; i < list.length; i++) {
      mid = list[i].id;
      var name = list[i].first ? (list[i].first + " " + (list[i].last || "")) : (list[i].name || mid);
      var ok = !!map[mid];
      if (ok) yes++; else no++;
      rows += "<tr><td>" + esc(name) + "</td><td>" + esc(list[i].trade || "") + "</td><td>" + (ok ? "Intro watched ✓" : "Intro watched ✗") + "</td></tr>";
    }
    var prev = (d.previousIntros || []).map(function (p) {
      return '<div class="tut-row is-hidden">' + (p.thumb ? '<img src="' + esc(p.thumb) + '" alt="">' : "") +
        '<div class="meta"><strong>' + esc(p.title) + "</strong><span class=\"devi-note\" style=\"display:block\">Archived " + esc(p.archivedAt || "") + " · " + esc(p.provider || "") + (p.sample ? " · sample" : "") + "</span></div></div>";
    }).join("");

    return '<div class="intro-sec-admin" id="intro-section">' +
      '<div class="pin">Pinned first · can’t be reordered or hidden</div>' +
      "<h2 style=\"margin:0 0 4px\">Introduction video</h2>" +
      '<p class="panel-sub">The first thing a new member sees after their profile is approved. They can’t skip it. When it ends, they are pointed to More → Video tutorials, then to Complete your profile.</p>' +
      '<div class="tut-url-preview">' + thumb(parsed.thumb || v.thumb) +
      "<div><strong>" + esc(v.title || "No intro set") + "</strong>" +
      (v.sample ? '<div class="tut-sample">Sample video — placeholder only</div>' : "") +
      '<div class="panel-sub">' + esc((v.provider || "") + (v.duration ? " · " + v.duration : "")) + "</div></div></div>" +
      '<div class="field"><label>YouTube or Vimeo URL</label><input id="introUrl" type="url" value="' + esc(draft.url) + '" placeholder="https://www.youtube.com/watch?v=…"></div>' +
      '<div class="field"><label>Title</label><input id="introTitle" type="text" value="' + esc(draft.title) + '"></div>' +
      '<div class="field"><label>Description</label><textarea id="introDesc" rows="2">' + esc(draft.description) + "</textarea></div>" +
      '<p class="devi-note">Replacing the intro archives the current one under Previous intro videos. Nothing is deleted.</p>' +
      '<button class="btn btn-primary" type="button" data-action="tut-save-intro">Save intro video</button>' +
      '<div class="setting-row" style="margin-top:16px"><div><strong>Required for new members (can’t skip)</strong><div class="panel-sub">On by default. Continue stays locked until they have watched about the minimum below. Seeking to the end does not count.</div></div>' +
      '<button class="toggle' + (d.requireIntro ? " on" : "") + '" type="button" data-action="tut-toggle-require" aria-pressed="' + (d.requireIntro ? "true" : "false") + '"><i></i></button></div>' +
      '<div class="field" style="margin-top:10px"><label>Minimum watched</label>' +
      '<div class="conf-row"><input id="introMinPct" type="range" min="70" max="100" step="1" value="' + (d.minWatchedPct || 90) + '">' +
      '<span class="conf-val" id="introMinPctVal">' + (d.minWatchedPct || 90) + "%</span></div></div>" +
      "<h3 style=\"margin:18px 0 6px;font-size:15px\">Intro watched</h3>" +
      '<p class="panel-sub">' + yes + " of " + list.length + " members have watched the intro · " + no + " have not</p>" +
      '<div style="overflow:auto"><table><thead><tr><th>Member</th><th>Trade</th><th>Intro</th></tr></thead><tbody>' + rows + "</tbody></table></div>" +
      (prev ? '<div class="tut-prev"><h4>Previous intro videos</h4>' + prev + "</div>" : "") +
      "</div>";
  }

  function sectionsPanel() {
    var d = data();
    var secs = d.sections.slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
    var body = secs.map(function (s, idx) {
      var vids = d.videos.filter(function (v) { return v.sectionId === s.id && !v.archived; })
        .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      var hidden = s.hidden ? " is-hidden" : "";
      var rows = vids.map(function (v) {
        return '<div class="tut-row' + (v.hidden ? " is-hidden" : "") + '">' + (v.thumb ? '<img src="' + esc(v.thumb) + '" alt="">' : "") +
          '<div class="meta"><strong>' + esc(v.title) + "</strong><span class=\"devi-note\" style=\"display:block\">" + esc(v.provider || "") + (v.duration ? " · " + esc(v.duration) : "") + (v.sample ? " · sample" : "") + (v.hidden ? " · hidden" : "") + "</span></div>" +
          '<div class="row-actions">' +
          '<button class="btn btn-ghost btn-sm" type="button" data-action="tut-edit-video" data-id="' + v.id + '">Edit</button>' +
          '<button class="btn btn-ghost btn-sm" type="button" data-action="tut-hide-video" data-id="' + v.id + '">' + (v.hidden ? "Show" : "Hide") + "</button></div></div>";
      }).join("") || '<p class="panel-sub">No videos in this section yet.</p>';
      return '<div class="tut-admin-sec' + hidden + '"><div class="sec-h"><h3>' + esc(s.title) + (s.hidden ? " · hidden" : "") + "</h3>" +
        (idx > 0 ? '<button class="btn btn-ghost btn-sm" type="button" data-action="tut-sec-up" data-id="' + s.id + '">Up</button>' : "") +
        (idx < secs.length - 1 ? '<button class="btn btn-ghost btn-sm" type="button" data-action="tut-sec-down" data-id="' + s.id + '">Down</button>' : "") +
        '<button class="btn btn-ghost btn-sm" type="button" data-action="tut-sec-rename" data-id="' + s.id + '">Rename</button>' +
        '<button class="btn btn-ghost btn-sm" type="button" data-action="tut-sec-hide" data-id="' + s.id + '">' + (s.hidden ? "Show section" : "Hide section") + "</button></div>" + rows + "</div>";
    }).join("");
    return panel("Tutorial sections", "Create sections such as Getting started or Leaving Google reviews. Hide a section or video instead of deleting it.",
      '<button class="btn btn-primary btn-sm" type="button" data-action="tut-add-section">Add a section</button>',
      body);
  }

  function addForm() {
    var d = data();
    var parsed = parseOrNull(formDraft.url);
    var editing = editingVideo ? d.videos.filter(function (v) { return v.id === editingVideo; })[0] : null;
    if (editing && !formDraft._loaded) {
      formDraft = { url: editing.url, title: editing.title, description: editing.description, sectionId: editing.sectionId, duration: editing.duration || "", _loaded: true };
      parsed = parseOrNull(formDraft.url);
    }
    var opts = d.sections.map(function (s) {
      return '<option value="' + s.id + '"' + (formDraft.sectionId === s.id ? " selected" : "") + ">" + esc(s.title) + "</option>";
    }).join("");
    return panel(editing ? "Edit video" : "Add a video", "Paste a YouTube or Vimeo link. The provider and thumbnail are detected automatically.", "",
      '<div class="field"><label>YouTube or Vimeo URL</label><input id="tutUrl" type="url" value="' + esc(formDraft.url) + '" placeholder="https://www.youtube.com/watch?v=… or https://vimeo.com/…"></div>' +
      (parsed ? '<div class="tut-url-preview">' + thumb(parsed.thumb) + "<div><strong>" + esc(parsed.provider === "youtube" ? "YouTube" : "Vimeo") + " detected</strong><div class=\"panel-sub\">Thumbnail preview</div></div></div>" :
        (formDraft.url ? '<p class="devi-note">That doesn’t look like a YouTube or Vimeo link yet.</p>' : "")) +
      '<div class="field"><label>Title</label><input id="tutTitle" type="text" value="' + esc(formDraft.title) + '"></div>' +
      '<div class="field"><label>Short description</label><textarea id="tutDesc" rows="2">' + esc(formDraft.description) + "</textarea></div>" +
      '<div class="field"><label>Section</label><select id="tutSection">' + opts + "</select></div>" +
      '<div class="field"><label>Duration <span class="opt">(optional)</span></label><input id="tutDur" type="text" placeholder="e.g. 3:05" value="' + esc(formDraft.duration) + '"></div>' +
      '<button class="btn btn-primary" type="button" data-action="tut-save-video">' + (editing ? "Save video" : "Add video") + "</button>" +
      (editing ? ' <button class="btn btn-ghost" type="button" data-action="tut-cancel-edit">Cancel</button>' : ""));
  }

  function pageHTML(page) {
    if (page !== "tutorials") return null;
    return (flash ? '<div class="devi-toast">' + esc(flash) + "</div>" : "") +
      '<div class="devi-toolbar"><span class="panel-sub" style="margin:0">Fictional sample videos, clearly marked. Hide or archive — nothing is deleted.</span></div>' +
      introPanel() +
      '<div class="devi-grid two" style="margin-top:8px">' + sectionsPanel() + addForm() + "</div>";
  }

  function grabForm() {
    var url = document.getElementById("tutUrl");
    var title = document.getElementById("tutTitle");
    var desc = document.getElementById("tutDesc");
    var sec = document.getElementById("tutSection");
    var dur = document.getElementById("tutDur");
    if (url) formDraft.url = url.value;
    if (title) formDraft.title = title.value;
    if (desc) formDraft.description = desc.value;
    if (sec) formDraft.sectionId = sec.value;
    if (dur) formDraft.duration = dur.value;
  }
  function grabIntro() {
    introDraft = {
      url: (document.getElementById("introUrl") || {}).value || "",
      title: (document.getElementById("introTitle") || {}).value || "",
      description: (document.getElementById("introDesc") || {}).value || "",
      duration: (document.getElementById("introDuration") || {}).value || ((document.getElementById("introTitle") && data().intro && data().intro.duration) || "")
    };
  }

  function handle(a, id, btn) {
    if (a.indexOf("tut-") !== 0) return false;
    var d = data();
    if (a === "tut-toggle-require") {
      d.requireIntro = !d.requireIntro;
      Tut().save(d);
      flash = d.requireIntro ? "New members must watch the intro before they can continue." : "The intro is optional for new members.";
      return true;
    }
    if (a === "tut-save-intro") {
      grabIntro();
      var res = Tut().setIntroFromUrl({
        url: introDraft.url,
        title: introDraft.title,
        description: introDraft.description,
        duration: introDraft.duration || (d.intro && d.intro.duration),
        durationSec: d.intro && d.intro.durationSec,
        sample: /youtube\.com\/watch\?v=(aqz-KE-bpKQ|eRsGyueVLvQ|jNQXAC9IVRw)|vimeo\.com\/1084537/.test(introDraft.url)
      });
      flash = res.error || "Intro video saved. If you replaced it, the old one is under Previous intro videos.";
      introDraft = null;
      return true;
    }
    if (a === "tut-add-section") {
      var name = (typeof window.prompt === "function" && window.prompt("Section name, for example Getting started", "New section")) || "";
      name = String(name || "").trim();
      if (!name) { flash = "Section not added."; return true; }
      var nid = "sec-" + Date.now();
      d.sections.push({ id: nid, title: name, order: d.sections.length + 1, hidden: false });
      Tut().save(d);
      flash = "Section “" + name + "” added.";
      return true;
    }
    if (a === "tut-sec-rename") {
      var sec = d.sections.filter(function (s) { return s.id === id; })[0];
      if (!sec) return true;
      var nn = (typeof window.prompt === "function" && window.prompt("Rename section", sec.title)) || sec.title;
      nn = String(nn || "").trim();
      if (nn) { sec.title = nn; Tut().save(d); flash = "Section renamed."; }
      return true;
    }
    if (a === "tut-sec-hide") {
      d.sections.forEach(function (s) { if (s.id === id) s.hidden = !s.hidden; });
      Tut().save(d);
      flash = "Section visibility updated. It was not deleted.";
      return true;
    }
    if (a === "tut-sec-up" || a === "tut-sec-down") {
      var list = d.sections.slice().sort(function (x, y) { return (x.order || 0) - (y.order || 0); });
      var at = -1, j;
      for (j = 0; j < list.length; j++) if (list[j].id === id) at = j;
      var swap = a === "tut-sec-up" ? at - 1 : at + 1;
      if (at >= 0 && swap >= 0 && swap < list.length) {
        var tmp = list[at].order; list[at].order = list[swap].order; list[swap].order = tmp;
        Tut().save(d);
      }
      flash = "Section order updated. The Introduction video section stays first.";
      return true;
    }
    if (a === "tut-hide-video") {
      d.videos.forEach(function (v) { if (v.id === id) v.hidden = !v.hidden; });
      Tut().save(d);
      flash = "Video visibility updated. It was not deleted.";
      return true;
    }
    if (a === "tut-edit-video") {
      editingVideo = id;
      formDraft = { url: "", title: "", description: "", sectionId: "getting-started", duration: "", _loaded: false };
      flash = "";
      return true;
    }
    if (a === "tut-cancel-edit") {
      editingVideo = null;
      formDraft = { url: "", title: "", description: "", sectionId: "getting-started", duration: "" };
      flash = "";
      return true;
    }
    if (a === "tut-save-video") {
      grabForm();
      var p = parseOrNull(formDraft.url);
      if (!p) { flash = "Paste a YouTube or Vimeo link."; return true; }
      if (!formDraft.title.trim()) { flash = "Add a title."; return true; }
      if (editingVideo) {
        d.videos.forEach(function (v) {
          if (v.id === editingVideo) {
            v.url = p.url; v.provider = p.provider; v.videoId = p.videoId; v.thumb = p.thumb; v.embed = p.embed;
            v.title = formDraft.title.trim(); v.description = formDraft.description; v.sectionId = formDraft.sectionId;
            v.duration = formDraft.duration;
          }
        });
        flash = "Video updated.";
      } else {
        d.videos.push({
          id: "v-" + Date.now(), sectionId: formDraft.sectionId, url: p.url, provider: p.provider, videoId: p.videoId,
          thumb: p.thumb, embed: p.embed, title: formDraft.title.trim(), description: formDraft.description,
          duration: formDraft.duration, order: d.videos.length + 1, hidden: false, sample: false
        });
        flash = "Video added.";
      }
      Tut().save(d);
      editingVideo = null;
      formDraft = { url: "", title: "", description: "", sectionId: formDraft.sectionId, duration: "" };
      return true;
    }
    return false;
  }

  function attach() {
    document.addEventListener("input", function (e) {
      if (e.target && e.target.id === "introMinPct") {
        var d = data();
        d.minWatchedPct = Number(e.target.value) || 90;
        Tut().save(d);
        var lab = document.getElementById("introMinPctVal");
        if (lab) lab.textContent = d.minWatchedPct + "%";
      }
      if (e.target && e.target.id === "tutUrl") {
        grabForm();
        if (window.TCAdmin && TCAdmin.paint) TCAdmin.paint();
      }
      if (e.target && e.target.id === "introUrl") {
        /* live thumb: store draft only, paint if needed */
        grabIntro();
      }
    });
  }

  window.TC181Admin = { pageHTML: pageHTML, handle: handle, attach: attach, flash: function () { return flash; } };
})();
