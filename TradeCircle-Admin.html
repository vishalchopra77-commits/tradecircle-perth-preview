  <script>
/* rb-backend.js */
/* Rate Buddies v1.9.0 — Supabase client wrapper (anon key only). */
(function (root) {
  "use strict";
  var DEMO_KEY = "rb_demo_offline";
  var client = null;
  var session = null;
  var profile = null;
  var subs = [];

  function cfg() { return root.RBConfig || {}; }
  function ready() { return !!(client && cfg().url && cfg().anonKey); }
  function isDemo() {
    try { return localStorage.getItem(DEMO_KEY) === "1"; } catch (e) { return false; }
  }
  function setDemo(on) {
    try {
      if (on) localStorage.setItem(DEMO_KEY, "1");
      else localStorage.removeItem(DEMO_KEY);
    } catch (e) {}
  }
  function toast(msg) {
    if (root.TradeCircle && TradeCircle.toast) TradeCircle.toast(msg);
    else if (root.TCAdmin) { /* admin may not have toast */ }
  }

  function init() {
    if (client) return client;
    if (!root.supabase || !cfg().url || !cfg().anonKey) return null;
    client = root.supabase.createClient(cfg().url, cfg().anonKey, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
    client.auth.onAuthStateChange(function (_evt, sess) {
      session = sess || null;
    });
    return client;
  }

  function profileFromRow(row) {
    if (!row) return null;
    var slug = (row.profile_url || "").split("/").pop() || row.id;
    return {
      id: row.id,
      slug: slug,
      first: row.first_name,
      last: row.last_name,
      name: ((row.first_name || "") + " " + (row.last_name || "")).trim(),
      business: row.business,
      trade: row.trade,
      regions: row.regions || [],
      areas: (row.regions || []).join(", "),
      state: row.state,
      city: row.city,
      status: row.status,
      role: row.role,
      intro_watched: !!row.intro_watched,
      recShare: row.rec_share || { phone: true, facebook: true, website: true, profile: true },
      phone: row.phone || "",
      facebook: row.facebook || "",
      page: row.page || "",
      links: { website: row.website || "", facebook: row.page || row.facebook || "" },
      profileUrl: row.profile_url || "",
      bio: row.bio || "",
      color: row.color || "navy",
      email: row.email,
      created_at: row.created_at,
      isMe: !!(session && session.user && session.user.id === row.id)
    };
  }

  async function getSession() {
    if (!init()) return null;
    var res = await client.auth.getSession();
    session = (res.data && res.data.session) || null;
    return session;
  }

  async function loadProfile() {
    if (!init() || !session) { profile = null; return null; }
    var res = await client.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (res.error) throw res.error;
    profile = profileFromRow(res.data);
    return profile;
  }

  async function login(email, password) {
    if (!init()) throw new Error("Not connected");
    var res = await client.auth.signInWithPassword({ email: email, password: password });
    if (res.error) throw res.error;
    session = res.data.session;
    await loadProfile();
    return profile;
  }

  async function signup(fields) {
    if (!init()) throw new Error("Not connected");
    var res = await client.auth.signUp({
      email: fields.email,
      password: fields.password,
      options: {
        data: {
          first_name: fields.first || "",
          last_name: fields.last || "",
          business: fields.business || "",
          trade: fields.trade || "",
          phone: fields.phone || ""
        }
      }
    });
    if (res.error) throw res.error;
    session = res.data.session;
    if (session) {
      await loadProfile();
      var patch = {
        first_name: fields.first || "",
        last_name: fields.last || "",
        business: fields.business || "",
        trade: fields.trade || "",
        phone: fields.phone || "",
        regions: fields.regions || [],
        city: fields.city || "Perth",
        state: fields.state || "wa"
      };
      var upd = await client.from("profiles").update(patch).eq("id", session.user.id);
      if (upd.error) throw upd.error;
      await loadProfile();
    }
    return { session: session, profile: profile, needsConfirm: !session };
  }

  async function logout() {
    if (!init()) return;
    await client.auth.signOut();
    session = null;
    profile = null;
    subs.forEach(function (s) { try { s.unsubscribe(); } catch (e) {} });
    subs = [];
  }

  async function listProfiles() {
    var res = await client.from("profiles").select("*").order("first_name");
    if (res.error) throw res.error;
    return (res.data || []).map(profileFromRow);
  }

  async function listRequests() {
    var res = await client.from("recommendation_requests").select("*").order("created_at", { ascending: false });
    if (res.error) throw res.error;
    return res.data || [];
  }

  async function listProgress(requestId) {
    var q = client.from("rec_progress").select("*");
    if (requestId) q = q.eq("request_id", requestId);
    var res = await q;
    if (res.error) throw res.error;
    return res.data || [];
  }

  async function listNotifications() {
    var res = await client.from("notifications").select("*").order("created_at", { ascending: false }).limit(50);
    if (res.error) throw res.error;
    return res.data || [];
  }

  async function listTutorials() {
    var secs = await client.from("tutorial_sections").select("*").order("sort_order");
    var vids = await client.from("tutorial_videos").select("*").order("sort_order");
    var intro = await client.from("intro_settings").select("*").eq("id", 1).maybeSingle();
    var prev = await client.from("previous_intros").select("*");
    if (secs.error) throw secs.error;
    if (vids.error) throw vids.error;
    return {
      sections: secs.data || [],
      videos: vids.data || [],
      intro: intro.data || null,
      previousIntros: (prev.data || [])
    };
  }

  async function approveMember(id) {
    var res = await client.rpc("admin_set_member_status", { target: id, new_status: "approved" });
    if (res.error) throw res.error;
    return res.data;
  }
  async function rejectMember(id) {
    var res = await client.rpc("admin_set_member_status", { target: id, new_status: "rejected" });
    if (res.error) throw res.error;
    return res.data;
  }
  async function approveRequest(id, featuredId) {
    var res = await client.rpc("admin_approve_request", { req: id, featured: featuredId || null });
    if (res.error) throw res.error;
    return res.data;
  }
  async function dismissRequest(id) {
    var res = await client.rpc("admin_dismiss_request", { req: id });
    if (res.error) throw res.error;
    return res.data;
  }
  async function createRequest(fields) {
    var res = await client.from("recommendation_requests").insert(fields).select().single();
    if (res.error) throw res.error;
    return res.data;
  }
  async function markRecommended(requestId) {
    var res = await client.from("rec_progress").insert({ request_id: requestId, member_id: session.user.id });
    if (res.error && String(res.error.message || "").indexOf("duplicate") === -1
        && res.error.code !== "23505") throw res.error;
    return true;
  }
  async function markIntroWatched() {
    var res = await client.from("profiles").update({ intro_watched: true }).eq("id", session.user.id);
    if (res.error) throw res.error;
    if (profile) profile.intro_watched = true;
  }
  async function addLedger(requestId, text) {
    var res = await client.from("rec_text_ledger").insert({
      request_id: requestId, viewer_id: session.user.id, issued_text: text
    });
    if (res.error && res.error.code !== "23505") throw res.error;
  }
  async function markVideoWatched(videoId) {
    var res = await client.from("tutorial_watched").insert({ member_id: session.user.id, video_id: videoId });
    if (res.error && res.error.code !== "23505") throw res.error;
  }

  function listen(table, cb) {
    if (!init()) return;
    var ch = client.channel("rb-" + table)
      .on("postgres_changes", { event: "*", schema: "public", table: table }, cb)
      .subscribe();
    subs.push(ch);
  }

  root.RB = {
    init: init, isDemo: isDemo, setDemo: setDemo, ready: ready,
    getSession: getSession, loadProfile: loadProfile,
    login: login, signup: signup, logout: logout,
    listProfiles: listProfiles, listRequests: listRequests, listProgress: listProgress,
    listNotifications: listNotifications, listTutorials: listTutorials,
    approveMember: approveMember, rejectMember: rejectMember,
    approveRequest: approveRequest, dismissRequest: dismissRequest, createRequest: createRequest,
    markRecommended: markRecommended, markIntroWatched: markIntroWatched,
    addLedger: addLedger, markVideoWatched: markVideoWatched,
    listen: listen, profileFromRow: profileFromRow,
    get session() { return session; },
    get profile() { return profile; },
    get client() { return client; }
  };
})(window);

</script>

    }
    if (a === "suspend") {
      members.forEach(function (m) { if (m.id === id) m.status = m.status === "active" ? "suspended" : "active"; });
      audit.unshift({ at: "Just now", who: "Vishal (you)", action: "Updated a member’s status" });
      paint();
    }
    if (a === "edit-mem") { selectedMem = id; page = "member-detail"; paint(); }
    if (a === "save-mem") {
      var mem = members.find(function (x) { return x.id === id; });
      if (mem) {
        document.querySelectorAll("[data-link]").forEach(function (inp) { mem[inp.getAttribute("data-link")] = inp.value.trim(); });
        audit.unshift({ at: "Just now", who: "Vishal (you)", action: "Updated profile links for " + mem.name });
      }
      window.alert("Links saved in this prototype only.");
      paint();
    }
    if (a === "add-trade") {
      var name = window.prompt("Trade name to add (prototype only)");
      if (name && name.trim()) { trades.unshift(name.trim()); paint(); }
    }
    if (a === "add-region") {
      var region = window.prompt("Region name to add (prototype only)");
      if (region && region.trim()) { regions.push(region.trim()); paint(); }
    }
    if (a === "del-region") {
      regions.splice(Number(id), 1);
      paint();
    }
    if (a === "resolve") { flags = flags.filter(function (f) { return f.id !== id; }); paint(); }
    if (a === "broadcast") {
      audit.unshift({ at: "Just now", who: "Vishal (you)", action: "Sent a mock broadcast" });
      window.alert("Mock broadcast queued. No real notification was sent.");
    }
    if (a === "move-up" || a === "remove-q") { window.alert("Queue change saved in this prototype only."); }
    if (a === "toggle") { btn.classList.toggle("on"); btn.setAttribute("aria-pressed", btn.classList.contains("on") ? "true" : "false"); }
    if (window.TC181Admin && TC181Admin.handle && TC181Admin.handle(a, id, btn, e)) {
      paint();
      return;
    }
    if (window.TC180Admin && TC180Admin.handle && TC180Admin.handle(a, id, btn, e)) {
      paint();
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "memSearch") { q = e.target.value; paint(); }
    if (e.target.id === "globalSearch" && e.target.value.length > 1) {
      q = e.target.value;
      if (page !== "members") { page = "members"; paint(); $("globalSearch").value = q; }
      else paint();
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "memFilter") {
      var val = e.target.value;
      q = val ? q : q;
      if (val) {
        // filter visually by temporarily wrapping paint — keep simple: store on element
      }
    }
  });

  $("loginBtn").innerHTML = I.login + "<span>Sign in to dashboard</span>";
  $("menuBtn").innerHTML = I.menu;
  $("notifBtn").insertAdjacentHTML("afterbegin", I.bell);

  window.TCAdmin = { go: go, paint: paint, esc: esc, panel: panel, badge: badge, facebookF: facebookF, I: I, who: who, av: av, requests: requests, members: members, getRequests: function(){return requests;}, getMembers: function(){return members;} };
  if (window.TC180Admin && TC180Admin.attach) TC180Admin.attach();
  if (window.TC181Admin && TC181Admin.attach) TC181Admin.attach();

  if (/[?&]shot=/.test(location.search) || location.hash === "#app") {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    var m = location.search.match(/shot=([a-z-]+)/);
    if (m && m[1] && m[1] !== "login") page = m[1];
    if (location.hash.replace("#", "") && location.hash !== "#app") page = location.hash.replace("#", "");
    paint();
  }
})();

</script>
  <script>
/* rb-admin.js */
/* Rate Buddies v1.9.0 — wire the web admin to Supabase. */
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }

  function showError(msg) {
    var el = $("loginForm") && $("loginForm").querySelector(".rb-login-error");
    if (!el && $("loginForm")) {
      el = document.createElement("p");
      el.className = "rb-login-error";
      el.style.cssText = "color:#B42318;font-weight:700;font-size:13px;margin:8px 0 0";
      $("loginForm").appendChild(el);
    }
    if (el) el.textContent = msg || "";
  }

  function fmtWhen(iso) {
    if (!iso) return "";
    try {
      var d = new Date(iso);
      return d.toLocaleString("en-AU", { timeZone: "Australia/Perth", hour: "numeric", minute: "2-digit", day: "numeric", month: "short" });
    } catch (e) { return iso; }
  }

  async function hydrate() {
    if (!window.TCAdmin || !RB.session) return;
    var profiles = await RB.listProfiles();
    var pending = profiles.filter(function (p) { return p.status === "pending" || p.status === "rejected"; });
    var active = profiles.filter(function (p) { return p.role !== "admin"; });
    if (TCAdmin.requests) {
      TCAdmin.requests.splice(0, TCAdmin.requests.length);
      pending.forEach(function (p) {
        TCAdmin.requests.push({
          id: p.id,
          first: p.first,
          last: p.last,
          business: p.business,
          trade: p.trade,
          areas: p.areas,
          phone: p.phone,
          status: p.status === "rejected" ? "declined" : p.status,
          when: fmtWhen(p.created_at) || "Just now",
          bio: p.bio
        });
      });
    }
    if (TCAdmin.members) {
      TCAdmin.members.splice(0, TCAdmin.members.length);
      active.filter(function (p) { return p.status === "approved" || p.status === "pending" || p.status === "rejected"; }).forEach(function (p) {
        TCAdmin.members.push({
          id: p.id,
          name: p.name,
          business: p.business,
          trade: p.trade,
          areas: p.areas,
          status: p.status === "approved" ? "active" : p.status,
          joined: "",
          website: (p.links && p.links.website) || "",
          facebook: p.page || p.facebook || ""
        });
      });
    }
    var reqs = await RB.listRequests();
    window.__rbRequests = reqs;
    if (window.TCDeviCity && Array.isArray(TCDeviCity.CIRCLE)) {
      TCDeviCity.CIRCLE.splice(0, TCDeviCity.CIRCLE.length);
      profiles.filter(function (m) { return m.status === "approved"; }).forEach(function (m) {
        TCDeviCity.CIRCLE.push({
          id: m.id, first: m.first, last: m.last, business: m.business,
          trade: m.trade, regions: m.regions || [], city: m.city || "Perth", areas: m.areas
        });
      });
    }
    if (window.TC180Admin && Array.isArray(TC180Admin.inbox)) {
      TC180Admin.inbox.splice(0, TC180Admin.inbox.length);
      reqs.forEach(function (r) {
        TC180Admin.inbox.push({
          id: r.id,
          status: r.status,
          group: r.group_name,
          snippet: r.snippet || r.ask || "",
          keyword: "",
          trade: r.trade,
          place: r.suburb || r.city,
          city: r.city,
          featuredId: r.featured_member_id || "",
          confidence: r.confidence || 0,
          link: r.post_link,
          when: r.when_label || fmtWhen(r.created_at),
          ofCount: r.of_count,
          approvedAt: r.approved_at ? "Approved" : "",
          token: r.id
        });
      });
    }
    if (TCAdmin.paint) TCAdmin.paint();
  }

  function hookLogin() {
    var form = $("loginForm");
    if (!form) return;
    form.addEventListener("submit", function (e) {
      if (window.RB && RB.isDemo()) return; /* existing handler shows the dashboard */
      e.preventDefault();
      e.stopImmediatePropagation();
      var fd = new FormData(form);
      var email = String(fd.get("email") || "").trim();
      var password = String(fd.get("password") || "");
      showError("");
      RB.login(email, password).then(function (p) {
        if (!p || p.role !== "admin") {
          RB.logout();
          showError("This login is not an admin account.");
          return;
        }
        $("loginView").classList.add("hidden");
        $("appView").classList.remove("hidden");
        return hydrate();
      }).catch(function (err) {
        showError((err && err.message) || "Could not sign in.");
      });
    }, true);
  }

  function hookActions() {
    document.addEventListener("click", function (e) {
      var btn = e.target.closest && e.target.closest("[data-action]");
      if (!btn || !RB.session || RB.isDemo()) return;
      var a = btn.getAttribute("data-action");
      var id = btn.getAttribute("data-id");
      if (a === "approve" && id) {
        e.preventDefault();
        e.stopImmediatePropagation();
        RB.approveMember(id).then(hydrate).catch(function (err) { window.alert(err.message || "Could not approve."); });
      }
      if (a === "decline" && id) {
        e.preventDefault();
        e.stopImmediatePropagation();
        RB.rejectMember(id).then(hydrate).catch(function (err) { window.alert(err.message || "Could not decline."); });
      }
      if (a === "devi-approve" && id) {
        e.preventDefault();
        e.stopImmediatePropagation();
        var featured = btn.getAttribute("data-featured") || null;
        var rec = (window.__rbRequests || []).filter(function (r) { return r.id === id; })[0];
        featured = featured || (rec && rec.featured_member_id);
        RB.approveRequest(id, featured).then(hydrate).catch(function (err) { window.alert(err.message || "Could not approve the request."); });
      }
      if (a === "devi-dismiss" && id) {
        e.preventDefault();
        e.stopImmediatePropagation();
        RB.dismissRequest(id).then(hydrate).catch(function (err) { window.alert(err.message || "Could not dismiss."); });
      }
      if (a === "devi-simulate") {
        /* create a pending request from the demo plumber post if possible */
      }
    }, true);

    document.addEventListener("change", function (e) {
      if (e.target && e.target.getAttribute("data-action") === "rb-demo") {
        RB.setDemo(e.target.checked);
      }
    });
  }

  function addDemoToggle() {
    var form = $("loginForm");
    if (!form || form.querySelector(".rb-demo-toggle")) return;
    var lab = document.createElement("label");
    lab.className = "rb-demo-toggle";
    lab.innerHTML = '<input type="checkbox" data-action="rb-demo"' + (RB.isDemo() ? " checked" : "") + "> Demo (offline)";
    form.appendChild(lab);
    var p = form.querySelector(".login-foot");
    if (p) p.innerHTML = 'Sign in with the admin test account. <a href="index.html">Back to the app</a>';
    var email = form.querySelector('input[name="email"]');
    var pw = form.querySelector('input[name="password"]');
    if (email && !RB.isDemo()) email.value = "";
    if (pw && !RB.isDemo()) pw.value = "";
    var mock = form.querySelector(".mock");
    if (mock && !RB.isDemo()) mock.textContent = "Test login — shared with the phone app";
    var sub = form.querySelector("p");
    if (sub && sub.textContent && sub.textContent.indexOf("mock") >= 0) {
      sub.textContent = "Approvals and requests here show up in the phone app.";
    }
  }

  function exposeAdminArrays() {
    if (!window.TCAdmin) return;
    /* admin.js keeps requests/members in closure; patch via a hook if exposed */
  }

  async function boot() {
    if (!window.RB) return;
    RB.init();
    addDemoToggle();
    hookLogin();
    hookActions();
    /* If the prototype already jumped the login (shot=), leave it. */
    if (location.search.match(/shot=/)) return;
    try {
      var sess = await RB.getSession();
      if (sess) {
        await RB.loadProfile();
        if (RB.profile && RB.profile.role === "admin") {
          $("loginView").classList.add("hidden");
          $("appView").classList.remove("hidden");
          await hydrate();
          RB.listen("profiles", function () { hydrate(); });
          RB.listen("recommendation_requests", function () { hydrate(); });
          RB.listen("rec_progress", function () { hydrate(); });
        }
      }
    } catch (err) {
      console.warn("RB admin boot", err);
    }
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else setTimeout(boot, 0);
  setTimeout(boot, 50);
})();

</script>
