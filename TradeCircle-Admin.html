<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>TradeCircle Perth — Super admin (prototype v1.5.1)</title>
  <style>
/* TradeCircle Perth — super admin (v1.5.1) */
:root {
  --navy: #0B1F33;
  --navy-2: #14314C;
  --accent: #0FBE86;
  --accent-ink: #066B4C;
  --bg: #F0F4F8;
  --card: #fff;
  --ink: #122033;
  --muted: #5B6B7C;
  --line: #E3E8EE;
  --danger: #B42318;
  --warn: #8A5A00;
  --fb: #1877F2;
  --shadow: 0 8px 24px rgba(11, 31, 51, .08);
  --shadow-lg: 0 18px 40px rgba(11, 31, 51, .12);
  --radius: 18px;
  --bottom-nav: 72px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
  font-family: "Plus Jakarta Sans", "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; }
a { color: #0D65D9; }
button svg, .icon-btn svg, .nav-btn svg, .btn svg { flex: 0 0 auto; }

/* Login */
.admin-login {
  min-height: 100vh; display: grid; place-items: center; padding: 24px;
  background: radial-gradient(900px 420px at 12% -8%, rgba(15,190,134,.28), transparent 52%),
              radial-gradient(800px 400px at 100% 100%, rgba(24,119,242,.16), transparent 50%),
              linear-gradient(180deg, #0A1A2B, #07131F);
}
.login-card {
  width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 32px 28px;
  box-shadow: 0 28px 60px rgba(0,0,0,.28);
}
.login-mark {
  width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
  background: linear-gradient(180deg, #24E0A6, #0FBE86); color: #05281C;
  font-weight: 800; font-size: 18px; letter-spacing: -.04em; margin-bottom: 14px;
  box-shadow: 0 8px 18px rgba(15,190,134,.35);
}
.login-mark.sm { width: 36px; height: 36px; font-size: 12px; border-radius: 11px; margin: 0; }
.login-card h1 { margin: 8px 0 4px; font-size: 26px; letter-spacing: -.03em; }
.login-card p { margin: 0 0 18px; color: var(--muted); font-weight: 600; }
.login-foot { margin: 16px 0 0 !important; font-size: 12px; font-weight: 600; color: var(--muted); text-align: center; }
.field { margin: 0 0 12px; }
.field label { display: block; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.field input, .field select, .field textarea {
  width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; background: #fff;
}
.field input:focus, .field select:focus, .field textarea:focus, .top-search input:focus, .search input:focus {
  outline: 2px solid rgba(15,190,134,.35); border-color: var(--accent);
}

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 12px; padding: 11px 16px; font-weight: 800; cursor: pointer; width: 100%;
  transition: transform .12s ease, box-shadow .12s ease, filter .12s ease; }
.btn:hover { filter: brightness(1.03); transform: translateY(-1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.btn-primary { background: linear-gradient(180deg, #24E0A6, #0FBE86); color: #05281C; box-shadow: 0 6px 14px rgba(15,190,134,.28); }
.btn-navy { background: linear-gradient(180deg, #1C4B73, #0B1F33); color: #fff; }
.btn-ghost { background: #fff; border: 1.5px solid var(--line); color: var(--ink); }
.btn-danger { background: #FDECEC; color: var(--danger); }
.btn-ok { background: #E7F8F1; color: var(--accent-ink); }
.btn-sm { width: auto; padding: 8px 12px; font-size: 13px; }
.ico-btn {
  width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
}
.ico-btn.ok { background: #E7F8F1; color: var(--accent-ink); }
.ico-btn.no { background: #FDECEC; color: var(--danger); }
.ico-btn.more { background: #F3F6FA; color: var(--ink); }
.ico-btn:hover { filter: brightness(.97); }
.mock { font-size: 11px; font-weight: 800; color: #8A5A00; background: #FFF6E0; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

/* Shell */
.shell { display: grid; grid-template-columns: 252px 1fr; min-height: 100vh; }
.side {
  background: linear-gradient(180deg, #0B1F33 0%, #0A2034 50%, #07131F 100%); color: #D5DEE6;
  padding: 18px 12px 28px; display: flex; flex-direction: column; gap: 4px;
  position: sticky; top: 0; height: 100vh; overflow: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
.brand strong { display: block; color: #fff; font-size: 15px; letter-spacing: -.02em; }
.brand span { font-size: 11px; color: #8AA0B2; font-weight: 600; }
.nav-group { font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #6E8598;
  padding: 14px 12px 6px; }
.nav-btn {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: none; border: 0; color: #D5DEE6; padding: 10px 12px; border-radius: 12px;
  font-weight: 700; font-size: 13.5px; cursor: pointer; position: relative;
}
.nav-btn svg { width: 18px; height: 18px; opacity: .9; }
.nav-btn .count {
  margin-left: auto; background: #F5B942; color: #3A2800; font-size: 10px; font-weight: 800;
  min-width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; padding: 0 5px;
}
.nav-btn.active, .nav-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.nav-btn.active { background: linear-gradient(90deg, rgba(15,190,134,.22), rgba(15,190,134,.06)); color: #fff;
  box-shadow: inset 3px 0 0 #0FBE86; }

.workspace { min-width: 0; display: flex; flex-direction: column; position: relative; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 14px 24px;
  background: rgba(255,255,255,.86); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 8;
}
.top-search {
  flex: 1; display: flex; align-items: center; gap: 8px; background: #F3F6FA;
  border: 1.5px solid var(--line); border-radius: 14px; padding: 0 12px; min-width: 0; max-width: 560px;
}
.top-search input { flex: 1; border: 0; background: transparent; padding: 10px 0; outline: none; min-width: 0; font-weight: 600; }
.top-search-ico { width: 16px; height: 16px; display: block; background: currentColor; color: #7A8A99;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3-3'/></svg>") center / contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2'><circle cx='11' cy='11' r='7'/><path d='M20 20l-3-3'/></svg>") center / contain no-repeat;
}
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff;
  display: inline-flex; align-items: center; justify-content: center; cursor: pointer; position: relative; color: var(--ink);
  flex: 0 0 auto;
}
.icon-btn:hover { background: #F3F6FA; }
.bell-dot {
  position: absolute; top: -4px; right: -4px; background: #E03131; color: #fff; font-size: 9px; font-weight: 800;
  min-width: 16px; height: 16px; border-radius: 999px; display: grid; place-items: center; padding: 0 4px; border: 2px solid #fff;
}
.admin-chip { display: flex; align-items: center; gap: 10px; padding: 4px 8px 4px 4px; border-radius: 999px; background: #fff; border: 1.5px solid var(--line); }
.admin-meta { display: flex; flex-direction: column; line-height: 1.15; padding-right: 6px; }
.admin-meta strong { font-size: 13px; }
.admin-meta span { font-size: 11px; color: var(--muted); font-weight: 600; }
.menu-btn { display: none; }

.notif-panel {
  position: absolute; right: 24px; top: 72px; width: min(360px, calc(100vw - 24px));
  background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-lg); z-index: 20; padding: 8px;
}
.notif-panel h3 { margin: 8px 10px 6px; font-size: 14px; }
.notif-item { display: flex; gap: 10px; padding: 10px; border-radius: 12px; }
.notif-item:hover { background: #F3F6FA; }
.notif-item p { margin: 0; font-size: 13px; font-weight: 600; }
.notif-item span { font-size: 11px; color: var(--muted); font-weight: 600; }

.main { padding: 22px 24px 48px; min-width: 0; }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.page-head h1 { margin: 0; font-size: 28px; letter-spacing: -.03em; }
.eyebrow { margin: 0 0 2px; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Avatars */
.av {
  width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
  font-weight: 800; font-size: 12px; color: #fff; flex: 0 0 auto; letter-spacing: -.02em;
}
.av-sm { width: 28px; height: 28px; font-size: 10px; }
.av-teal { background: linear-gradient(180deg, #24E0A6, #0FBE86); color: #05281C; }
.av-navy { background: linear-gradient(180deg, #2A5E8A, #0B1F33); }
.av-blue { background: linear-gradient(180deg, #4BA0FF, #1877F2); }
.av-amber { background: linear-gradient(180deg, #FFD56A, #F0A202); color: #3A2800; }
.av-rose { background: linear-gradient(180deg, #FF8BA0, #E03131); }
.av-purple { background: linear-gradient(180deg, #B197FC, #7048E8); }
.who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.who .name { font-weight: 800; }
.who .sub { font-size: 12px; color: var(--muted); font-weight: 600; }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi {
  position: relative; overflow: hidden; border-radius: 20px; padding: 16px 16px 14px;
  color: #fff; box-shadow: var(--shadow); min-height: 128px;
  display: flex; flex-direction: column;
}
.kpi::after {
  content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%;
  right: -36px; top: -48px; background: rgba(255,255,255,.12);
}
.kpi-ico {
  width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
  background: rgba(255,255,255,.18); margin-bottom: 10px;
}
.kpi .n { font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.kpi .l { font-size: 13px; font-weight: 700; margin-top: 6px; opacity: .92; }
.kpi-trend {
  margin-top: auto; padding-top: 10px; font-size: 11px; font-weight: 800;
  display: inline-flex; align-items: center; gap: 4px;
}
.kpi-trend.up { color: #D4FFE9; }
.kpi-trend.flat { color: rgba(255,255,255,.85); }
.kpi-teal { background: linear-gradient(135deg, #24E0A6, #0A8F66); color: #05281C; }
.kpi-teal .kpi-trend.up { color: #054C35; }
.kpi-navy { background: linear-gradient(135deg, #2A5E8A, #0B1F33); }
.kpi-blue { background: linear-gradient(135deg, #4BA0FF, #1559C9); }
.kpi-amber { background: linear-gradient(135deg, #FFD56A, #E08A00); color: #3A2800; }
.kpi-amber .kpi-trend { color: #3A2800; }

/* Charts + layout */
.dash-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; margin-bottom: 14px; }
.chart-card, .panel {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.chart-card { margin: 0; }
.panel { overflow: auto; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.panel h2, .chart-card h2 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
.panel-sub { margin: 2px 0 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding: 8px 0 0; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; height: 100%; justify-content: flex-end; }
.bar {
  width: 100%; max-width: 28px; border-radius: 8px 8px 4px 4px;
  background: linear-gradient(180deg, #24E0A6, #0FBE86); min-height: 6px;
}
.bar.alt { background: linear-gradient(180deg, #4BA0FF, #1877F2); }
.bar-col span { font-size: 10px; font-weight: 700; color: var(--muted); }

/* Tables */
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
tbody tr:hover { background: #F8FAFC; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 800; }
.b-wait { background: #FFF6E0; color: #8A5A00; }
.b-ok { background: #E7F8F1; color: #066B4C; }
.b-no { background: #FDECEC; color: #9B2C2C; }
.b-info { background: #E8F1FD; color: #1559C9; }
.b-paid { background: #F3E8FF; color: #5F3DC4; }

.search { display: flex; gap: 8px; margin-bottom: 12px; }
.search input, .search select { flex: 1; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; }

/* Activity + queue */
.feed { display: flex; flex-direction: column; gap: 0; }
.feed-item { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.feed-item:last-child { border-bottom: 0; }
.feed-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; flex: 0 0 auto; background: var(--accent); }
.feed-dot.warn { background: #F0A202; }
.feed-dot.info { background: var(--fb); }
.feed-item p { margin: 0; font-size: 13px; font-weight: 700; }
.feed-item span { font-size: 11px; color: var(--muted); font-weight: 600; }
.queue-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.queue-row:last-child { border-bottom: 0; }
.pos {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  background: #F3F6FA; font-weight: 800; font-size: 12px; color: var(--navy);
}
.pos.paid { background: linear-gradient(180deg, #B197FC, #7048E8); color: #fff; }

/* Empty */
.empty {
  text-align: center; padding: 36px 16px; color: var(--muted);
}
.empty .empty-ico {
  width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 12px;
  display: grid; place-items: center; background: linear-gradient(180deg, #E7F8F1, #F3F6FA); color: var(--accent-ink);
}
.empty h3 { margin: 0 0 4px; color: var(--ink); font-size: 16px; }
.empty p { margin: 0; font-weight: 600; font-size: 13px; }

/* Settings cards */
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting-row:last-child { border: 0; }
.toggle { width: 44px; height: 26px; border-radius: 999px; background: #CDD5DD; position: relative; border: 0; cursor: pointer; flex: 0 0 auto; }
.toggle.on { background: linear-gradient(180deg, #24E0A6, #0FBE86); }
.toggle i { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.toggle.on i { left: 21px; }
.price-tbc { font-size: 12px; font-weight: 800; color: #8A5A00; background: #FFF6E0; padding: 3px 8px; border-radius: 999px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: #F3F6FA; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 700; }
.chip button { border: 0; background: none; cursor: pointer; color: var(--muted); font-weight: 800; }

.hidden { display: none !important; }
.overlay { position: fixed; inset: 0; background: rgba(8,16,28,.45); display: none; align-items: flex-end; justify-content: center; z-index: 40; }
.overlay.show { display: flex; }
.sheet { background: #fff; width: min(560px, 100%); border-radius: 20px 20px 0 0; padding: 18px; max-height: 86vh; overflow: auto; }
.backdrop { display: none; }

.bottom-nav { display: none; }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: 1fr 1fr; }
  .dash-grid { grid-template-columns: 1fr; }
  .admin-meta { display: none; }
}
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .side {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); height: 100vh;
    transform: translateX(-105%); transition: transform .2s; z-index: 30;
  }
  .side.open { transform: none; }
  .backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 25; }
  .menu-btn { display: inline-flex; }
  .main { padding: 16px 14px calc(var(--bottom-nav) + 24px); }
  .topbar { padding: 10px 12px; }
  .notif-panel { right: 12px; top: 64px; }
  table, thead, tbody, th, td, tr { display: block; }
  thead { display: none; }
  tr { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; background: #fff; }
  td { border: 0; padding: 4px 0; }
  td::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; }
  td[data-label=""]::before, td:has(.row-actions)::before { display: none; }
  .bottom-nav {
    display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.94); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); z-index: 15;
    padding: 6px 6px calc(8px + env(safe-area-inset-bottom));
  }
  .bnav {
    background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 800; color: #6B7A89; padding: 6px 2px; cursor: pointer; position: relative;
  }
  .bnav svg { width: 20px; height: 20px; }
  .bnav.active { color: #0A8F66; }
  .bnav .count {
    position: absolute; top: 2px; right: calc(50% - 18px); background: #E03131; color: #fff;
    font-size: 9px; min-width: 14px; height: 14px; border-radius: 999px; display: grid; place-items: center;
  }
}

  </style>

    @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/PlusJakartaSans-VariableFont_wght.ttf") format("truetype"); font-weight: 200 800; font-display: swap; }

<body>
  <div id="loginView" class="admin-login">
    <form class="login-card" id="loginForm">
      <div class="login-mark" aria-hidden="true">TC</div>
      <span class="mock">Demo login — prototype only</span>
      <h1>Super admin</h1>
      <p>TradeCircle Perth dashboard. This is a mock. Nothing is saved on a server.</p>
      <div class="field"><label>Email</label><input name="email" type="email" value="vishal@tradecircle.demo" autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" value="demopass" autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in to dashboard</button>
      <p class="login-foot">Use the pre-filled demo details. <a href="index.html">Back to the app preview</a></p>
    </form>
  </div>

  <div id="appView" class="shell hidden">
    <div id="backdrop" class="backdrop hidden"></div>
    <aside class="side" id="side">
      <div class="brand">
        <div class="login-mark sm" aria-hidden="true">TC</div>
        <div><strong>TradeCircle</strong><span>Super admin · v1.5.1</span></div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu"></button>
        <div class="top-search">
          <span class="top-search-ico" aria-hidden="true"></span>
          <input id="globalSearch" type="search" placeholder="Search members, trades, requests…" autocomplete="off">
        </div>
        <button class="icon-btn" id="notifBtn" type="button" aria-label="Notifications"><span class="bell-dot">3</span></button>
        <div class="admin-chip" title="Vishal Chopra">
          <div class="av av-teal">VC</div>
          <div class="admin-meta"><strong>Vishal Chopra</strong><span>Super admin</span></div>
        </div>
      </header>
      <div id="notifPanel" class="notif-panel hidden" role="dialog" aria-label="Notifications"></div>
      <main class="main">
        <div class="page-head">
          <div>
            <p class="eyebrow" id="pageEyebrow">Overview</p>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <span class="mock">Fictional data</span>
        </div>
        <div id="page"></div>
      </main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
  </div>
  <script>
/* TradeCircle Perth — Australian trades list (see TRADES-SOURCES.md) */
window.TC_TRADES = [
  "Air Conditioning",
  "Appliance Installer",
  "Appliance Repair",
  "Arborist",
  "Asbestos Removal",

      '<article class="kpi kpi-blue"><div class="kpi-ico">' + I.alerts + '</div><div class="n">7</div><div class="l">Alerts this week</div><div class="kpi-trend up">' + I.trend + " +3 vs last week</div></article>" +
      '<article class="kpi kpi-navy"><div class="kpi-ico">' + I.queue + '</div><div class="n">' + queue.length + '</div><div class="l">In the promo queue</div><div class="kpi-trend flat">1 paid jump pending</div></article>' +
      "</div>";
  }

  function requestRows(list, compact) {
    if (!list.length) return empty("No requests right now", "New member applications will appear here for you to approve.");
    return '<table><thead><tr><th>Member</th><th>Trade</th>' + (compact ? "" : "<th>Areas</th>") + "<th>When</th><th>Status</th><th></th></tr></thead><tbody>" +
      list.map(function (r) {
        var name = r.first + " " + r.last;
        return "<tr><td data-label=\"Member\">" + who(name, r.business) + "</td>" +
          '<td data-label="Trade">' + esc(r.trade) + "</td>" +
          (compact ? "" : '<td data-label="Areas">' + esc(r.areas) + "</td>") +
          '<td data-label="When">' + esc(r.when) + "</td>" +
          '<td data-label="Status">' + badge(r.status) + "</td>" +
          '<td data-label="">' + (r.status === "pending"
            ? '<div class="row-actions">' + icoBtn("approve", r.id, "ok", I.check, "Approve") + icoBtn("decline", r.id, "no", I.x, "Decline") + "</div>"
            : "") + "</td></tr>";
      }).join("") + "</tbody></table>";
  }

  function pageHTML() {
    if (page === "dashboard") {
      return kpis() +
        '<div class="dash-grid">' +
          '<section class="chart-card"><div class="panel-h"><div><h2>Members joined</h2><p class="panel-sub">Fictional weekly sign-ups</p></div></div>' + bars(memberWeeks) + "</section>" +
          '<section class="chart-card"><div class="panel-h"><div><h2>Recommendation alerts</h2><p class="panel-sub">Fictional weekly alerts sent</p></div></div>' + bars(alertWeeks, true) + "</section>" +
        "</div>" +
        '<div class="dash-grid">' +
          panel("Recent profile requests", "Approve or decline from here", '<button class="btn btn-ghost btn-sm" data-page="requests">' + I.requests + "<span>View all</span></button>", requestRows(requests, true)) +
          '<div>' +
            panel("Recent activity", "What has happened in the circle", "", '<div class="feed">' + activity.map(function (a) {
              return '<div class="feed-item"><div class="feed-dot ' + a.kind + '"></div><div><p>' + esc(a.text) + "</p><span>" + esc(a.at) + "</span></div></div>";
            }).join("") + "</div>") +
            panel("Promotion queue", "Who is up next", '<button class="btn btn-ghost btn-sm" data-page="queue">' + I.queue + "<span>Manage</span></button>", queue.slice(0, 4).map(function (row) {
              return '<div class="queue-row"><div class="pos' + (row.paid ? " paid" : "") + '">' + row.pos + "</div>" + av(row.name, "av-sm") + "<div><div class=\"name\">" + esc(row.name) + '</div><div class="sub">' + esc(row.when) + "</div></div>" + badge(row.plan) + "</div>";
            }).join("")) +
          "</div>" +
        "</div>";
    }
    if (page === "requests") {
      var detail = requests.filter(function (r) { return r.status === "pending"; }).map(function (r) {
        return '<article class="panel"><div class="panel-h">' + who(r.first + " " + r.last, r.business) + badge(r.status) + "</div>" +
          "<p class=\"panel-sub\" style=\"margin-bottom:10px\">" + esc(r.bio) + "</p>" +
          '<table><tbody><tr><td data-label="Trade">' + esc(r.trade) + '</td><td data-label="Areas">' + esc(r.areas) + '</td><td data-label="Phone">' + esc(r.phone) + '</td><td data-label="Submitted">' + esc(r.when) + "</td></tr></tbody></table>" +
          '<div class="row-actions" style="margin-top:12px"><button class="btn btn-ok btn-sm" data-action="approve" data-id="' + r.id + '">' + I.check + "<span>Approve</span></button>" +
          '<button class="btn btn-danger btn-sm" data-action="decline" data-id="' + r.id + '">' + I.x + "<span>Decline</span></button></div></article>";
      }).join("");
      return (detail || empty("No one is waiting", "New profile requests will land here.")) + panel("All requests", "Including ones you have already reviewed", "", requestRows(requests, false));
    }
    if (page === "members") {
      var list = members.filter(function (m) {
        var hay = (m.name + " " + m.business + " " + m.trade + " " + m.areas).toLowerCase();
        return !q || hay.indexOf(q.toLowerCase()) >= 0;
      });
      return panel("Members", members.length + " members in this fictional circle", "",
        '<div class="search"><input id="memSearch" type="search" placeholder="Search by name, trade or area" value="' + esc(q) + '"><select id="memFilter"><option value="">All statuses</option><option>active</option><option>suspended</option></select></div>' +
        (list.length ? '<table><thead><tr><th>Member</th><th>Trade</th><th>Areas</th><th>Joined</th><th>Status</th><th></th></tr></thead><tbody>' +
          list.map(function (m) {
            return "<tr><td data-label=\"Member\">" + who(m.name, m.business) + '</td><td data-label="Trade">' + esc(m.trade) + '</td><td data-label="Areas">' + esc(m.areas) + '</td><td data-label="Joined">' + esc(m.joined) + '</td><td data-label="Status">' + badge(m.status) + '</td><td data-label=""><div class="row-actions">' +
              icoBtn("edit-mem", m.id, "more", I.edit, "Edit") +
              icoBtn("suspend", m.id, m.status === "active" ? "no" : "ok", m.status === "active" ? I.x : I.check, m.status === "active" ? "Suspend" : "Reactivate") +
              "</div></td></tr>";
          }).join("") + "</tbody></table>" : empty("No members match", "Try a different name, trade or area.")));
    }
    if (page === "regions") {
      return panel("Service regions", "Used in the app’s area picker", '<button class="btn btn-primary btn-sm" data-action="add-region">' + I.plus + "<span>Add a region</span></button>",
        '<div class="chips">' + regions.map(function (r, i) {
          return '<span class="chip">' + esc(r) + ' <button type="button" data-action="del-region" data-id="' + i + '" aria-label="Remove">×</button></span>';
        }).join("") + "</div>");
    }
    if (page === "trades") {
      var shown = trades.slice(0, 80);
      return panel("Trade list", trades.length + " trades from Australian directories", '<button class="btn btn-primary btn-sm" data-action="add-trade">' + I.plus + "<span>Add a trade</span></button>",
        '<div class="chips">' + shown.map(function (t) { return '<span class="chip">' + esc(t) + "</span>"; }).join("") + "</div>" +
        (trades.length > 80 ? '<p class="panel-sub" style="margin-top:12px">Showing the first 80. The full list is in the app trade picker.</p>' : ""));
    }
    if (page === "alerts") {
      return panel("Recommendation alerts", "Posts the circle was asked to comment on", "",
        '<table><thead><tr><th>Posted by</th><th>Trade</th><th>Facebook post</th><th>Comments</th><th>When</th><th>Status</th></tr></thead><tbody>' +
        alerts.map(function (a) {
          return "<tr><td data-label=\"Posted by\">" + who(a.by, "") + '</td><td data-label="Trade">' + esc(a.trade) + '</td><td data-label="Facebook post">' + esc(a.post) + '</td><td data-label="Comments">' + a.comments + '</td><td data-label="When">' + esc(a.when) + '</td><td data-label="Status">' + badge(a.status) + "</td></tr>";
        }).join("") + "</tbody></table>");
    }
    if (page === "queue") {
      return panel("Promotion queue", "Everyone gets a free turn. Jumping the queue is paid, with the price still to be set.", "",
        (queue.length ? '<table><thead><tr><th>#</th><th>Member</th><th>Plan</th><th>When</th><th></th></tr></thead><tbody>' +
          queue.map(function (row) {
            return "<tr><td data-label=\"#\"><div class=\"pos" + (row.paid ? " paid" : "") + '">' + row.pos + "</div></td><td data-label=\"Member\">" + who(row.name, row.plan) + '</td><td data-label="Plan">' + badge(row.plan) + '</td><td data-label="When">' + esc(row.when) + '</td><td data-label=""><div class="row-actions">' +
              icoBtn("move-up", String(row.pos), "more", I.up, "Move up") +
              icoBtn("remove-q", String(row.pos), "no", I.x, "Remove") +
              "</div></td></tr>";
          }).join("") + "</tbody></table>" : empty("The queue is empty", "Members can request a turn from the app.")));
    }
    if (page === "reports") {
      return panel("Flagged content", "Reports from members, waiting for a decision", "",
        flags.length ? '<table><thead><tr><th>From</th><th>About</th><th>Reason</th><th>When</th><th>Status</th><th></th></tr></thead><tbody>' +
          flags.map(function (f) {
            return "<tr><td data-label=\"From\">" + who(f.who, "") + '</td><td data-label="About">' + esc(f.about) + '</td><td data-label="Reason">' + esc(f.reason) + '</td><td data-label="When">' + esc(f.when) + '</td><td data-label="Status">' + badge(f.status) + '</td><td data-label="">' +
              '<div class="row-actions">' + icoBtn("resolve", f.id, "ok", I.check, "Resolve") + "</div></td></tr>";
          }).join("") + "</tbody></table>" : empty("Nothing flagged", "When a member reports a message or profile, it will show here."));
    }
    if (page === "chats") {
      return panel("Chat moderation", "A sample of recent conversations. This is fictional.", "",
        '<table><thead><tr><th>From</th><th>Room</th><th>Message</th><th>Flag</th><th>When</th></tr></thead><tbody>' +
        chats.map(function (c) {
          return "<tr><td data-label=\"From\">" + who(c.from, "") + '</td><td data-label="Room">' + esc(c.room) + '</td><td data-label="Message">' + esc(c.text) + '</td><td data-label="Flag">' + (c.flag === "None" ? badge("Handled") : badge("Open")) + " " + esc(c.flag) + '</td><td data-label="When">' + esc(c.when) + "</td></tr>";
        }).join("") + "</tbody></table>");
    }
    if (page === "plans") {
      return '<div class="dash-grid">' +
        '<section class="panel"><div class="panel-h"><h2>Free</h2><span class="price-tbc">Current plan</span></div><p class="panel-sub">The circle is free for now. Members can join, chat, send alerts and take a free turn in the promotion queue.</p></section>' +
        '<section class="panel"><div class="panel-h"><h2>Pro</h2><span class="price-tbc">Price to be set</span></div><p class="panel-sub">Planned later. Could include jumping the promotion queue and extra tools. No payment is collected in this prototype.</p></section>' +
        "</div>" +
        panel("Members on a plan", "Fictional counts only", "",
          '<table><thead><tr><th>Plan</th><th>Members</th><th>Price</th></tr></thead><tbody>' +
          "<tr><td data-label=\"Plan\">Free</td><td data-label=\"Members\">8</td><td data-label=\"Price\">Free for now</td></tr>" +
          "<tr><td data-label=\"Plan\">Pro</td><td data-label=\"Members\">0</td><td data-label=\"Price\"><span class=\"price-tbc\">Price to be set</span></td></tr></tbody></table>");
    }
    if (page === "ai") {
      return panel("AI integrations", "Members can connect their own assistant in the app. This is a prototype — nothing is actually connected.", "",
        '<div class="setting-row"><div><strong>Allow Grok</strong><div class="panel-sub">Shown as a mock option in the app.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>' +
        '<div class="setting-row"><div><strong>Allow ChatGPT</strong><div class="panel-sub">Shown as a mock option in the app.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>' +
        '<div class="setting-row"><div><strong>Allow Claude</strong><div class="panel-sub">Shown as a mock option in the app.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>' +
        '<div class="setting-row"><div><strong>Voice commands</strong><div class="panel-sub">The assistant opens the right screen. The member still taps to confirm friend requests and reviews.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>');
    }
    if (page === "broadcast") {
      return panel("Broadcast a notification", "This is a mock. Nothing is sent to real phones.", "",
        '<div class="field"><label>Title</label><input id="bcTitle" value="Reminder: Hills meet this Thursday"></div>' +
        '<div class="field"><label>Message</label><textarea id="bcBody" rows="4">The weekly catch-up is at 6:30 pm in Midland. Bring a mate if you like.</textarea></div>' +
        '<button class="btn btn-primary btn-sm" data-action="broadcast" style="width:auto">' + I.send + "<span>Send mock broadcast</span></button>");
    }
    if (page === "settings") {
      return panel("General settings", "Prototype only — changes stay in this browser session.", "",
        '<div class="setting-row"><div><strong>New members need approval</strong><div class="panel-sub">Decided. New sign-ups wait until you approve them.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>' +
        '<div class="setting-row"><div><strong>Recommendation alerts</strong><div class="panel-sub">Members get a push when someone shares a Facebook post.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>' +
        '<div class="setting-row"><div><strong>Paid queue jumps</strong><div class="panel-sub">Price to be set. No payments are collected in this prototype.</div></div><button class="toggle on" data-action="toggle" type="button" aria-pressed="true"><i></i></button></div>');
    }
    if (page === "audit") {
      return panel("Audit log", "A record of admin and system actions. Fictional.", "",
        '<table><thead><tr><th>When</th><th>Who</th><th>Action</th></tr></thead><tbody>' +
        audit.map(function (a) {
          return "<tr><td data-label=\"When\">" + esc(a.at) + '</td><td data-label="Who">' + who(a.who, "") + '</td><td data-label="Action">' + esc(a.action) + "</td></tr>";
        }).join("") + "</tbody></table>");
    }
    return empty("Coming later", "This page is not in the prototype yet.");
  }

  function paint() {
    renderNav();
    var t = TITLES[page] || ["Admin", "Admin"];
    $("pageEyebrow").textContent = t[0];
    $("pageTitle").textContent = t[1];
    $("page").innerHTML = pageHTML();
    var search = $("memSearch");
    if (search) {
      search.value = q;
      search.focus();
      try { search.setSelectionRange(q.length, q.length); } catch (e) {}
    }
  }

  function openMenu() { $("side").classList.add("open"); $("backdrop").classList.remove("hidden"); }
  function closeMenu() { $("side").classList.remove("open"); $("backdrop").classList.add("hidden"); }

  function renderNotifs() {
    $("notifPanel").innerHTML =
      "<h3>Notifications</h3>" +
      [["Nina Kaur applied to join.", "Today 8:10 am", "requests"],
       ["A pest control alert is still open.", "Today 7:30 am", "alerts"],
       ["Tom Reeves jumped the promotion queue.", "Sat 10:12 am", "queue"]].map(function (n) {
        return '<button class="notif-item" type="button" data-page="' + n[2] + '">' + av(n[0]) + "<div><p>" + esc(n[0]) + "</p><span>" + n[1] + "</span></div></button>";
      }).join("");
  }

  function go(id) {
    if (id === "more") { openMenu(); return; }
    page = id;
    notifOpen = false;
    $("notifPanel").classList.add("hidden");
    closeMenu();
    paint();
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    paint();
  });
  $("menuBtn").addEventListener("click", function () {
    if ($("side").classList.contains("open")) closeMenu(); else openMenu();
  });
  $("backdrop").addEventListener("click", closeMenu);
  $("notifBtn").addEventListener("click", function (e) {
    e.stopPropagation();
    notifOpen = !notifOpen;
    $("notifPanel").classList.toggle("hidden", !notifOpen);
    if (notifOpen) renderNotifs();
  });
  document.addEventListener("click", function (e) {
    if (notifOpen && !$("notifPanel").contains(e.target) && e.target !== $("notifBtn") && !$("notifBtn").contains(e.target)) {
      notifOpen = false;
      $("notifPanel").classList.add("hidden");
    }
    var nav = e.target.closest("[data-page]");
    if (nav && !e.target.closest("[data-action]")) {
      go(nav.getAttribute("data-page"));
    }
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var a = btn.getAttribute("data-action");
    var id = btn.getAttribute("data-id");
    if (a === "approve" || a === "decline") {
      requests.forEach(function (r) { if (r.id === id) r.status = a === "approve" ? "approved" : "declined"; });
      audit.unshift({ at: "Just now", who: "Vishal (you)", action: (a === "approve" ? "Approved" : "Declined") + " a profile request" });
      paint();
    }
    if (a === "suspend") {
      members.forEach(function (m) { if (m.id === id) m.status = m.status === "active" ? "suspended" : "active"; });
      audit.unshift({ at: "Just now", who: "Vishal (you)", action: "Updated a member’s status" });
      paint();
    }
    if (a === "edit-mem") { window.alert("In a real build this would open an edit form. This is a prototype."); }
    if (a === "add-trade") {
      var name = window.prompt("Trade name to add (prototype only)");
      if (name && name.trim()) { trades.unshift(name.trim()); paint(); }
    }
    if (a === "add-region") {
      var region = window.prompt("Region name to add (prototype only)");
      if (region && region.trim()) { regions.push(region.trim()); paint(); }
    }
    if (a === "del-region") {
      regions.splice(Number(id), 1);
      paint();
    }
    if (a === "resolve") { flags = flags.filter(function (f) { return f.id !== id; }); paint(); }
    if (a === "broadcast") {
      audit.unshift({ at: "Just now", who: "Vishal (you)", action: "Sent a mock broadcast" });
      window.alert("Mock broadcast queued. No real notification was sent.");
    }
    if (a === "move-up" || a === "remove-q") { window.alert("Queue change saved in this prototype only."); }
    if (a === "toggle") { btn.classList.toggle("on"); btn.setAttribute("aria-pressed", btn.classList.contains("on") ? "true" : "false"); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "memSearch") { q = e.target.value; paint(); }
    if (e.target.id === "globalSearch" && e.target.value.length > 1) {
      q = e.target.value;
      if (page !== "members") { page = "members"; paint(); $("globalSearch").value = q; }
      else paint();
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "memFilter") {
      var val = e.target.value;
      q = val ? q : q;
      if (val) {
        // filter visually by temporarily wrapping paint — keep simple: store on element
      }
    }
  });

  $("loginBtn").innerHTML = I.login + "<span>Sign in to dashboard</span>";
  $("menuBtn").innerHTML = I.menu;
  $("notifBtn").insertAdjacentHTML("afterbegin", I.bell);

  if (/[?&]shot=/.test(location.search) || location.hash === "#app") {
    $("loginView").classList.add("hidden");
    $("appView").classList.remove("hidden");
    var m = location.search.match(/shot=([a-z-]+)/);
    if (m && m[1] && m[1] !== "login") page = m[1];
    if (location.hash.replace("#", "") && location.hash !== "#app") page = location.hash.replace("#", "");
    paint();
  }
})();

  </script>
</body>
</html>
