<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rate Buddies — Super admin (prototype v2.1.1)</title>
  <meta name="theme-color" content="#0A1328" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo/icon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="v161.css" />
  <link rel="stylesheet" href="v180.css" />
  <link rel="stylesheet" href="v181.css" />
  <link rel="stylesheet" href="v171.css" />
  <link rel="stylesheet" href="v20.css" />
  <link rel="stylesheet" href="v180.css" />
  <style>
    @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/PlusJakartaSans-VariableFont_wght.ttf") format("truetype"); font-weight: 200 800; font-display: swap; }
  </style>
</head>
<body>
  <div id="loginView" class="admin-login">
    <form class="login-card" id="loginForm">
      <img class="login-mark" src="assets/logo/icon-192.png" alt="" width="64" height="64">
      <div class="login-wordmark">RATE <span>BUDDIES</span></div>
      <span class="mock">Test login — shared with the phone app</span>
      <h1>Super admin</h1>
      <p>Approvals and requests here show up in the phone app.</p>
      <div class="field"><label>Email</label><input name="email" type="email" value="" autocomplete="username"></div>
      <div class="field"><label>Password</label><input name="password" type="password" value="" autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">Sign in to dashboard</button>
      <p class="login-foot">Sign in with the admin test account. <a href="index.html">Back to the app</a></p>
    </form>
  </div>

  <div id="appView" class="shell hidden">
    <div id="backdrop" class="backdrop hidden"></div>
    <aside class="side" id="side">
      <div class="brand">
        <img class="login-mark sm" src="assets/logo/rank-buddies-mark.png" alt="">
        <div><strong>Rate Buddies</strong><span>Super admin · v2.1.1</span></div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu"></button>
        <div class="top-search">
          <span class="top-search-ico" aria-hidden="true"></span>
          <input id="globalSearch" type="search" placeholder="Search members, trades, requests…" autocomplete="off">
        </div>
        <button class="icon-btn" id="notifBtn" type="button" aria-label="Notifications"><span class="bell-dot">3</span></button>
        <div class="admin-chip" title="Vishal Chopra">
          <div class="av av-teal">VC</div>
          <div class="admin-meta"><strong>Vishal Chopra</strong><span>Super admin</span></div>
        </div>
      </header>
      <div id="notifPanel" class="notif-panel hidden" role="dialog" aria-label="Notifications"></div>
      <main class="main">
        <div class="page-head">
          <div>
            <p class="eyebrow" id="pageEyebrow">Overview</p>
            <h1 id="pageTitle">Dashboard</h1>
          </div>
          <span class="mock">Fictional data</span>
        </div>
        <div id="page"></div>
      </main>
    </div>
    <nav class="bottom-nav" id="bottomNav" aria-label="Main"></nav>
  </div>
  <script src="locations.js"></script>
  <script src="trades.js"></script>
  <script src="profile-extras.js"></script>
  <script src="devi-city.js"></script>
  <script src="tutorials-store.js"></script>
  <script src="admin-v180.js"></script>
  <script src="admin-v181.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="rb-config.js"></script>
  <script src="rb-backend.js"></script>
  <script src="admin.js"></script>
  <script src="rb-admin.js"></script>
</body>
</html>
